      <div class="lifecycle">
        <a class="workflow-node" href="pages/collection.html"><span class="workflow-number text-small-bold">01</span><strong class="text-normal-bold">知识采集</strong><span class="workflow-meta text-small">8 个任务运行中</span></a>
        <a class="workflow-node" href="pages/resources.html"><span class="workflow-number text-small-bold">02</span><strong class="text-normal-bold">知识资源</strong><span class="workflow-meta text-small">1,286 份待加工</span></a>
        <a class="workflow-node is-current" href="pages/processing.html"><span class="workflow-number text-small-bold">03</span><strong class="text-normal-bold">知识加工</strong><span class="workflow-meta text-small">24 个批次执行中</span></a>
        <a class="workflow-node" href="pages/assets.html"><span class="workflow-number text-small-bold">04</span><strong class="text-normal-bold">知识资产</strong><span class="workflow-meta text-small">36 项待审核</span></a>

          <div class="activity-item"><span class="activity-dot"></span><div class="activity-content"><strong class="text-normal">《对公授信审查办法》版本发布</strong><div class="activity-time text-small">6 项资产待审核</div></div></div>
          <div class="activity-item"><span class="activity-dot"></span><div class="activity-content"><strong class="text-normal">客户实体合并冲突</strong><div class="activity-time text-small">18 组候选实体待确认</div></div></div>
          <div class="activity-item"><span class="activity-dot"></span><div class="activity-content"><strong class="text-normal">授信专题图谱发布</strong><div class="activity-time text-small">图谱版本 v2.4 待审批</div></div></div>

        <a class="module-card" href="pages/collection.html"><div class="module-card-top"><h3 class="text-medium-bold">知识采集</h3><span class="module-index text-number">01</span></div><p class="text-normal">统一接入文件、数据库、API 和消息数据，同步原始权限。</p><div class="module-card-footer"><span class="text-small">32 个数据源</span><span>→</span></div></a>
        <a class="module-card" href="pages/resources.html"><div class="module-card-top"><h3 class="text-medium-bold">知识资源</h3><span class="module-index text-number">02</span></div><p class="text-normal">管理原始资源、来源系统、基础元数据、版本与处理状态。</p><div class="module-card-footer"><span class="text-small">286,430 份资源</span><span>→</span></div></a>
        <a class="module-card" href="pages/processing.html"><div class="module-card-top"><h3 class="text-medium-bold">知识加工</h3><span class="module-index text-number">03</span></div><p class="text-normal">通过解析、切片、抽取、对齐、融合和质量评估生成候选知识。</p><div class="module-card-footer"><span class="text-small">24 个批次运行中</span><span>→</span></div></a>

        <a class="module-card" href="pages/operations.html"><div class="module-card-top"><h3 class="text-medium-bold">知识运营</h3><span class="module-index text-number">08</span></div><p class="text-normal">从无答案、冲突、过期和用户反馈中驱动知识持续保鲜。</p><div class="module-card-footer"><span class="text-small">94.6% 知识健康度</span><span>→</span></div></a>
