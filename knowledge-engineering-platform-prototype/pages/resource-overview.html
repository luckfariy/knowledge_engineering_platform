<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>资源概览 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=35" />
</head>
<body data-page="resource-overview">
  <div data-shell></div>
  <template data-page-template>
    <header class="page-heading">
      <div><h1 class="page-title text-x-big-bold">资源概览</h1><p class="page-description text-normal">统一查看企业资源的规模、类型分布、接入状态与治理质量。</p></div>
      <div class="page-actions"><button class="btn btn-medium btn-secondary" type="button" data-toast="文档报告已生成">导出报告</button></div>
    </header>
    <section class="grid grid-4" aria-label="资源核心指标">
      <article class="metric-card"><div class="metric-label text-normal"><span>资源总量</span><span class="tag tag-small">全类型</span></div><div class="metric-value text-x-big-bold text-number">286,430</div><div class="metric-foot text-small"><span class="trend-up">+8.7%</span><span>较上月</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>已完成加工</span></div><div class="metric-value text-x-big-bold text-number">241,806</div><div class="metric-foot text-small"><span>加工覆盖率 84.4%</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>待完善元数据</span></div><div class="metric-value text-x-big-bold text-number">3,286</div><div class="metric-foot text-small"><span class="trend-risk">428 份低于 60%</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>今日新增</span></div><div class="metric-value text-x-big-bold text-number">9,842</div><div class="metric-foot text-small"><span>企业 8,126</span><span>团队与个人 1,716</span></div></article>
    </section>
    <section class="section grid grid-main-aside">
      <article class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">最近文档活动</h2><p class="panel-description text-small">跨空间查看最新上传、同步与自动入目记录</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>文档</th><th>所属空间</th><th>来源</th><th>更新时间</th><th>状态</th></tr></thead><tbody><tr><td class="cell-primary">对公授信审查办法<span class="cell-secondary text-small">PDF · V3.2</span></td><td>企业空间</td><td>制度中台</td><td>2 分钟前</td><td><span class="tag tag-status tag-status-lime">已加工</span></td></tr><tr><td class="cell-primary">零售业务培训资料<span class="cell-secondary text-small">DOCX · V1.0</span></td><td>团队空间</td><td>本地上传</td><td>18 分钟前</td><td><span class="tag tag-status tag-status-blue">解析中</span></td></tr><tr><td class="cell-primary">客户访谈纪要<span class="cell-secondary text-small">DOCX · V2.1</span></td><td>个人空间</td><td>本地上传</td><td>1 小时前</td><td><span class="tag tag-status tag-status-secondary">已解析</span></td></tr></tbody></table></div></article>
      <aside class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">文档健康度</h2><p class="panel-description text-small">综合完整性、时效性和权限状态</p></div></div><div class="status-list"><div class="status-row"><div><strong>元数据完整度</strong><small>业务与管理属性覆盖</small></div><strong class="text-number">96</strong><div class="progress"><span data-bar="96"></span></div></div><div class="status-row"><div><strong>内容解析成功率</strong><small>近 30 日解析任务</small></div><strong class="text-number">98</strong><div class="progress"><span data-bar="98"></span></div></div><div class="status-row"><div><strong>权限配置完整度</strong><small>企业空间文档</small></div><strong class="text-number">92</strong><div class="progress"><span data-bar="92"></span></div></div></div></aside>
    </section>
  </template>
  <script type="module" src="../assets/js/app.js?v=35"></script>
</body>
</html>
