<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>个人空间文件详情 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=47" />
</head>
<body data-page="resource-directory-personal-detail">
  <div data-shell></div>
  <template data-page-template>
    <header class="page-heading document-detail-heading">
      <div><a class="back-link text-small" href="personal-documents.html?context=catalog">‹ 返回个人空间</a><h1 class="page-title text-x-big-bold" data-query-file>文件详情</h1><p class="page-description text-normal">个人空间文件的内容与基本信息</p></div>
      <div class="page-actions"><button class="btn btn-medium btn-secondary" type="button" data-toast="已开始下载">下载</button><button class="btn btn-medium btn-primary" type="button" data-toast="已打开新版本上传">更新版本</button></div>
    </header>

    <section class="file-detail-tabs" data-tabs>
      <div class="tabs" role="tablist" aria-label="个人文件详情内容">
        <button class="tabs-item is-active" id="personal-file-info-tab" type="button" role="tab" aria-selected="true" aria-controls="personal-file-info-panel">文件信息</button>
        <button class="tabs-item" id="personal-file-preview-tab" type="button" role="tab" aria-selected="false" aria-controls="personal-file-preview-panel">文件预览</button>
      </div>

      <div class="file-detail-panel" id="personal-file-info-panel" role="tabpanel" aria-labelledby="personal-file-info-tab">
        <section class="panel asset-info-section file-summary-card">
          <div class="panel-header"><div><h2 class="panel-title text-medium-bold">文件摘要</h2><p class="panel-description text-small">基于文件原文自动生成</p></div><span class="tag tag-status tag-status-lime">已确认</span></div>
          <p class="asset-summary">本文件说明对公授信业务的受理条件、审查职责、风险评价要求和审批流程，明确客户准入、财务分析、担保审查及贷后管理等关键控制点，适用于企业客户授信申请及存量授信复审场景。</p>
        </section>
        <div class="file-info-grid">
          <section class="panel asset-info-section">
            <div class="panel-header"><div><h2 class="panel-title text-medium-bold">基本信息</h2><p class="panel-description text-small">个人空间文件的基础属性</p></div><span class="tag tag-status tag-status-secondary">PDF</span></div>
            <dl class="asset-property-list"><div><dt>文件名称</dt><dd data-query-file>文件详情</dd></div><div><dt>所属空间</dt><dd>个人空间</dd></div><div><dt>文件类型</dt><dd>PDF</dd></div><div><dt>当前版本</dt><dd class="text-number">v2.1</dd></div><div><dt>创建人</dt><dd>当前用户</dd></div><div><dt>更新时间</dt><dd>2026-09-05 10:26</dd></div></dl>
          </section>
          <section class="panel asset-info-section file-tag-card">
            <div class="panel-header"><div><h2 class="panel-title text-medium-bold">标签信息</h2><p class="panel-description text-small">AI 自动打标，支持用户手动补充</p></div><button class="btn btn-dense btn-primary" type="button" data-open-file-tag-dialog>添加标签</button></div>
            <div class="catalog-tag-list" aria-label="文件标签" data-file-detail-tags></div>
            <div class="tag-evidence-list"><article><div><strong class="text-small-bold">AI 自动打标证据</strong><span class="text-small">标签完成后，将逐项展示对应的原文片段、页码或媒体时间点</span></div><button class="btn btn-dense btn-text" type="button" data-show-file-evidence>查看原文</button></article></div>
          </section>
        </div>
      </div>

      <div class="file-detail-panel" id="personal-file-preview-panel" role="tabpanel" aria-labelledby="personal-file-preview-tab" hidden>
        <section class="panel file-preview-card">
          <div class="panel-header"><div><h2 class="panel-title text-medium-bold">原文预览</h2><p class="panel-description text-small">第 1 页 / 共 28 页</p></div><div class="page-actions"><button class="btn btn-dense btn-secondary" type="button" data-toast="已缩小预览">缩小</button><button class="btn btn-dense btn-secondary" type="button" data-toast="已放大预览">放大</button></div></div>
          <article class="document-paper"><div class="document-page-number text-small">第 1 页</div><h3 class="text-big-bold" data-query-file>文件详情</h3><h4 class="text-medium-bold">第一章 总则</h4><p>第一条 为规范本行对公授信业务审查工作，加强授信风险管理，提高授信决策质量，根据国家有关法律法规及本行风险管理制度，制定本办法。</p><p>第二条 本办法适用于境内各级机构办理的企业客户授信业务，包括流动资金贷款、固定资产贷款、贸易融资、票据承兑及其他表内外授信业务。</p><h4 class="text-medium-bold">第二章 审查职责</h4><p>第三条 授信审查应坚持独立、审慎、全面和客观原则，重点评价客户经营状况、偿债能力、资金用途、担保措施和行业风险。</p><p>第四条 业务发起机构负责资料真实性和完整性，审查部门负责对授信方案、风险因素及缓释措施提出独立审查意见。</p></article>
        </section>
      </div>
    </section>

    <div class="dialog-mask" data-file-tag-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="personal-file-tag-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="personal-file-tag-dialog-title">添加标签</h2><p class="dialog-description text-small">为当前文件手动补充一个标签，添加后将同步到标签管理。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-file-tag-dialog-close></button></header><form data-file-tag-form><div class="dialog-body"><label class="field"><span class="field-label">标签名称</span><span class="input-wrap input-middle"><input class="input" name="fileTagName" list="personal-file-tag-suggestions" maxlength="30" required placeholder="输入或选择标签" autocomplete="off" /></span></label><datalist id="personal-file-tag-suggestions" data-file-tag-suggestions></datalist><p class="field-hint text-small">可选择已有标签，也可以输入新的业务标签。</p></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-file-tag-dialog-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认添加</button></footer></form></section></div>
  </template>
  <script type="module" src="../assets/js/app.js?v=47"></script>
</body>
</html>
