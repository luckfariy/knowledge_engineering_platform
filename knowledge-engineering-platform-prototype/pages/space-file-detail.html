              <div data-file-attribute><span class="text-small">业务域</span><strong data-attribute-value>信贷业务</strong><span class="input-wrap input-middle" hidden><input class="input" value="信贷业务" aria-label="业务域" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 提取</span><span>第 1 页 · “对公授信业务审查工作”</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">业务分类</span><strong data-attribute-value>对公授信审查</strong><span class="input-wrap input-middle" hidden><input class="input" value="对公授信审查" aria-label="业务分类" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 提取</span><span>第 1 页 · 标题及正文高频主题</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">业务使用场景</span><strong data-attribute-value>企业客户授信申请、审查与存量授信复审</strong><span class="input-wrap input-middle" hidden><input class="input" value="企业客户授信申请、审查与存量授信复审" aria-label="业务使用场景" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 提取</span><span>第 1 页 · 适用对象与办理场景</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">内容摘要</span><strong data-attribute-value>明确客户准入、财务分析、担保审查及贷后管理等关键控制要求</strong><span class="input-wrap input-middle" hidden><input class="input" value="明确客户准入、财务分析、担保审查及贷后管理等关键控制要求" aria-label="内容摘要" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 生成</span><span>全文综合 · 基于正文内容生成</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
            </div>
          </section>

          <section class="panel asset-info-section enterprise-attribute-card" data-enterprise-attributes>
            <h2 class="panel-title text-medium-bold">管理属性</h2>
            <div class="file-attribute-list">
              <div data-file-attribute><span class="text-small">所属部门</span><strong data-attribute-value>风险管理部</strong><span class="input-wrap input-middle" hidden><input class="input" value="风险管理部" aria-label="所属部门" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 识别</span><span>封面 · 编制部门信息</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">数据主人</span><strong data-attribute-value>授信审批中心</strong><span class="input-wrap input-middle" hidden><input class="input" value="授信审批中心" aria-label="数据主人" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">系统匹配</span><span>来源知识源与归口部门映射</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">资源负责人</span><strong data-attribute-value>王翠</strong><span class="input-wrap input-middle" hidden><input class="input" value="王翠" aria-label="资源负责人" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 识别</span><span>封面 · 编制部门联系人“王翠”</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">共享范围</span><strong data-attribute-value>总行及一级分行</strong><span class="input-wrap input-middle" hidden><input class="input" value="总行及一级分行" aria-label="共享范围" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 识别</span><span>第 1 页 · 文件适用机构</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">生命周期状态</span><strong data-attribute-value>在用</strong><span class="input-wrap input-middle" hidden><input class="input" value="在用" aria-label="生命周期状态" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">系统状态</span><span>文件当前有效且持续使用</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">过期时间</span><strong data-attribute-value>长期有效</strong><span class="input-wrap input-middle" hidden><input class="input" value="长期有效" aria-label="过期时间" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">AI 推断</span><span>第 28 页 · 有效期条款</span><button type="button" data-show-file-evidence>查看原文</button></span></div>
              <div data-file-attribute><span class="text-small">版本号</span><strong data-attribute-value>v3.2</strong><span class="input-wrap input-middle" hidden><input class="input" value="v3.2" aria-label="版本号" /></span><span class="ai-evidence"><span class="tag tag-status tag-status-blue">系统证据</span><span>文件版本记录</span><button type="button" data-show-file-evidence>查看原文</button></span></div>

            </div>
            <div class="file-attribute-actions" data-file-attribute-actions hidden><button class="btn btn-medium btn-secondary" type="button" data-cancel-file-attributes>取消</button><button class="btn btn-medium btn-primary" type="button" data-save-file-attributes>保存</button></div>
          </section>

          <section class="panel asset-info-section file-tag-card">
            <div class="panel-header"><div><h2 class="panel-title text-medium-bold">标签信息</h2><p class="panel-description text-small">AI 自动打标，支持用户手动补充</p></div><button class="btn btn-dense btn-primary" type="button" data-open-file-tag-dialog>添加标签</button></div>
            <div class="catalog-tag-list" aria-label="文件标签" data-file-detail-tags></div>
            <div class="tag-evidence-list"><article><div><strong class="text-small-bold">AI 自动打标证据</strong><span class="text-small">标签完成后，将逐项展示对应的原文片段、页码或媒体时间点</span></div><button class="btn btn-dense btn-text" type="button" data-show-file-evidence>查看原文</button></article></div>
          </section>

          </section>
        </div>
      </div>

      <div class="file-detail-panel" id="file-preview-panel" role="tabpanel" aria-labelledby="file-preview-tab" hidden>
        <section class="panel file-preview-card">
          <div class="panel-header"><div><h2 class="panel-title text-medium-bold">原文预览</h2><p class="panel-description text-small">第 1 页 / 共 28 页</p></div><div class="page-actions"><button class="btn btn-dense btn-secondary" type="button" data-toast="已缩小预览">缩小</button><button class="btn btn-dense btn-secondary" type="button" data-toast="已放大预览">放大</button></div></div>
          <article class="document-paper"><div class="document-page-number text-small">第 1 页</div><h3 class="text-big-bold" data-query-file>对公授信审查办法</h3><h4 class="text-medium-bold">第一章 总则</h4><p>第一条 为规范本行对公授信业务审查工作，加强授信风险管理，提高授信决策质量，根据国家有关法律法规及本行风险管理制度，制定本办法。</p><p>第二条 本办法适用于境内各级机构办理的企业客户授信业务，包括流动资金贷款、固定资产贷款、贸易融资、票据承兑及其他表内外授信业务。</p><h4 class="text-medium-bold">第二章 审查职责</h4><p>第三条 授信审查应坚持独立、审慎、全面和客观原则，重点评价客户经营状况、偿债能力、资金用途、担保措施和行业风险。</p><p>第四条 业务发起机构负责资料真实性和完整性，审查部门负责对授信方案、风险因素及缓释措施提出独立审查意见。</p></article>
        </section>
      </div>
    </section>
    <div class="dialog-mask" data-file-tag-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="file-tag-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="file-tag-dialog-title">添加标签</h2><p class="dialog-description text-small">为当前文件手动补充一个标签，添加后将同步到标签管理。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-file-tag-dialog-close></button></header><form data-file-tag-form><div class="dialog-body"><label class="field"><span class="field-label">标签名称</span><span class="input-wrap input-middle"><input class="input" name="fileTagName" list="file-tag-suggestions" maxlength="30" required placeholder="输入或选择标签" autocomplete="off" /></span></label><datalist id="file-tag-suggestions" data-file-tag-suggestions></datalist><p class="field-hint text-small">可选择已有标签，也可以输入新的业务标签。</p></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-file-tag-dialog-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认添加</button></footer></form></section></div>
  </template>
