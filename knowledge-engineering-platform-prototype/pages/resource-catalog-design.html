<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>资源目录设计 - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css?v=31"/></head><body data-page="resource-catalog-design"><div data-shell></div><template data-page-template>
<header class="page-heading"><div><h1 class="page-title text-x-big-bold">资源目录设计</h1><p class="page-description text-normal">设计资源分类体系及分类专属属性，为后续文档分类和属性自动抽取提供标准。</p></div><div class="page-actions"><button class="btn btn-medium btn-primary" type="button" data-open-design-tree>新建目录树</button></div></header>
<section class="catalog-design-summary" aria-label="目录设计说明"><div><strong class="text-normal-bold">分类先行</strong><span class="text-small">先定义文档属于哪一类</span></div><span>→</span><div><strong class="text-normal-bold">属性建模</strong><span class="text-small">为各分类配置专属字段</span></div><span>→</span><div><strong class="text-normal-bold">自动抽取</strong><span class="text-small">加工阶段按分类抽取属性</span></div></section>
<section class="catalog-design-workbench">
  <aside class="panel catalog-schema-panel"><div class="catalog-schema-heading"><div><h2 class="panel-title text-medium-bold">目录树</h2><p class="panel-description text-small"><span data-design-tree-count>1</span> 套分类体系 · 最多五层</p></div></div><label class="field catalog-schema-switch"><span class="field-label text-small">当前目录树</span><span class="input-wrap input-middle"><select class="input" data-design-tree-select><option value="document">文档库分类管理</option></select></span></label><div class="catalog-schema-meta"><strong class="text-normal-bold" data-design-tree-title>文档库分类管理</strong><p class="text-small" data-design-tree-description>按照企业文档的业务载体类型进行分类</p></div><nav class="catalog-type-list" data-document-category-list aria-label="文档分类"></nav><button class="btn btn-medium btn-secondary catalog-add-category" type="button" data-add-design-category>＋ 新建一级目录</button></aside>
  <section class="panel catalog-attribute-panel"><div class="catalog-attribute-heading"><div><div class="catalog-attribute-title"><h2 class="panel-title text-medium-bold" data-category-title>制度类</h2><span class="tag tag-status tag-status-blue">文档分类</span></div><p class="panel-description text-small" data-category-description>企业正式发布的制度、办法、细则及操作规范。</p></div><div class="page-actions"><button class="btn btn-dense btn-secondary" type="button" data-toast="分类信息编辑已打开">编辑分类</button><button class="btn btn-dense btn-primary" type="button" data-open-property-dialog>新增属性</button></div></div><div class="catalog-extraction-note"><strong class="text-normal-bold">属性抽取准备</strong><span class="text-small">文档进入知识生产后，可依据当前分类的属性定义生成抽取任务；必填属性用于完整度校验。</span></div><div class="table-wrap"><table class="table"><thead><tr><th>属性名称</th><th>字段编码</th><th>数据类型</th><th>是否必填</th><th>抽取提示</th><th class="cell-actions">操作</th></tr></thead><tbody data-category-property-rows></tbody></table></div></section>
</section>
<div class="dialog-mask" data-design-tree-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="design-tree-dialog-title"><header class="dialog-header"><h2 class="dialog-title" id="design-tree-dialog-title">新建目录树</h2><button class="dialog-close" data-design-tree-close aria-label="关闭"></button></header><form data-design-tree-form><div class="dialog-body"><label class="field"><span class="field-label">目录树名称</span><span class="input-wrap input-middle"><input class="input" name="treeName" required maxlength="30" placeholder="例如：业务档案分类"/></span></label><label class="field"><span class="field-label">目录树描述</span><span class="input-wrap"><textarea class="input catalog-design-textarea" name="treeDescription" required maxlength="100" rows="3" placeholder="说明分类体系的适用范围"></textarea></span></label></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-design-tree-close>取消</button><button class="btn btn-medium btn-primary" type="submit">创建目录树</button></footer></form></section></div>
<div class="dialog-mask" data-property-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="property-dialog-title"><header class="dialog-header"><h2 class="dialog-title" id="property-dialog-title">新增分类属性</h2><button class="dialog-close" data-property-close aria-label="关闭"></button></header><form data-property-form><div class="dialog-body"><label class="field"><span class="field-label">属性名称</span><span class="input-wrap input-middle"><input class="input" name="propertyName" required placeholder="例如：发文机构"/></span></label><label class="field"><span class="field-label">字段编码</span><span class="input-wrap input-middle"><input class="input" name="propertyCode" required pattern="[a-z][a-z0-9_]*" placeholder="例如：issuing_org"/></span><span class="field-hint text-small">使用小写字母、数字和下划线。</span></label><label class="field"><span class="field-label">数据类型</span><span class="input-wrap input-middle"><select class="input" name="propertyType"><option>文本</option><option>日期</option><option>数字</option><option>单选</option><option>多选</option></select></span></label><label class="control"><input class="checkbox" type="checkbox" name="required"/><span class="control-label">设为必填属性</span></label><label class="field"><span class="field-label">抽取提示</span><span class="input-wrap input-middle"><input class="input" name="propertyPrompt" required placeholder="说明从文档何处识别该属性"/></span></label></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-property-close>取消</button><button class="btn btn-medium btn-primary" type="submit">保存属性</button></footer></form></section></div>
<div class="dialog-mask" data-design-category-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="design-category-title"><header class="dialog-header"><h2 class="dialog-title" id="design-category-title" data-design-category-title>新建一级目录</h2><button class="dialog-close" data-design-category-close aria-label="关闭"></button></header><form data-design-category-form><div class="dialog-body"><div class="folder-parent-summary"><span class="text-small">上级目录</span><strong class="text-normal-bold" data-design-parent-name>当前目录树</strong><span class="tag tag-small" data-design-category-level>一级目录</span></div><label class="field"><span class="field-label">目录名称</span><span class="input-wrap input-middle"><input class="input" name="categoryName" required maxlength="20" placeholder="例如：方案类"/></span></label><label class="field"><span class="field-label">目录描述</span><span class="input-wrap"><textarea class="input catalog-design-textarea" name="categoryDescription" required maxlength="100" rows="3" placeholder="说明该目录包含的文档范围"></textarea></span></label></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-design-category-close>取消</button><button class="btn btn-medium btn-primary" type="submit">创建目录</button></footer></form></section></div>
</template><script type="module" src="../assets/js/app.js?v=34"></script></body></html>
