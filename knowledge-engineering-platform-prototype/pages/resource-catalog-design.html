<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>资源目录管理 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=38" />
</head>
<body data-page="resource-catalog-design" data-directory-default-space="personal"><div data-shell></div><template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">个人空间</h1><p class="page-description text-normal">管理仅属于当前用户的目录与资源，不与团队空间混合展示。</p></div></header>
  <section class="resource-directory-workbench" aria-label="资源目录与文件">
    <aside class="panel resource-directory-panel" aria-label="目录树">
      <div class="resource-directory-heading"><div><h2 class="panel-title text-medium-bold">目录树</h2><p class="panel-description text-small" data-directory-space-summary>企业业务分类目录</p></div><button class="btn btn-dense btn-primary" type="button" data-open-resource-directory>新建业务目录</button></div>
      <label class="field resource-directory-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索目录" aria-label="搜索目录" data-resource-directory-search /></span></label>
      <p class="resource-directory-note text-small" data-directory-space-note>个人目录仅由当前用户管理。</p>
      <nav class="resource-directory-tree" role="tree" aria-label="资源目录" data-resource-directory-tree></nav>
    </aside>
    <section class="panel resource-directory-files" aria-labelledby="resource-directory-files-title">
      <div class="resource-directory-file-heading"><div><div class="asset-file-path text-small"><button type="button" data-resource-directory-root>个人空间</button><span>/</span><span data-resource-directory-path>全部文件</span></div><h2 class="panel-title text-medium-bold" id="resource-directory-files-title" data-resource-directory-title>全部文件</h2><p class="panel-description text-small" data-resource-directory-description>展示个人空间中的全部文件</p></div><div class="directory-permission-summary" data-directory-permission-summary hidden><span class="text-small">管理 <strong data-directory-manage-count>0</strong> · 编辑 <strong data-directory-edit-count>0</strong> · 查看 <strong data-directory-view-count>0</strong></span></div></div>
      <div class="tabs tabs-dense resource-directory-content-tabs" role="tablist" aria-label="目录内容"><button class="tabs-item is-active" type="button" role="tab" aria-selected="true" data-directory-content-tab="resources">资源列表</button><button class="tabs-item" type="button" role="tab" aria-selected="false" data-directory-content-tab="permissions" data-team-permission-tab hidden>权限设置</button></div>
      <div class="resource-directory-tab-panel" data-directory-content-panel="resources">
        <div class="toolbar resource-directory-toolbar"><label class="field file-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索资源名称、类型或创建人" aria-label="搜索目录资源" data-resource-directory-file-search /></span></label><span class="toolbar-spacer"></span><span class="text-small" data-resource-directory-file-count>0 项资源</span><button class="btn btn-dense btn-primary" type="button" data-open-directory-resource>添加资源</button></div>
        <div class="table-wrap"><table class="table" id="resource-directory-file-table"><thead><tr><th>资源名称</th><th>资源类型</th><th>所属目录</th><th>创建人</th><th>更新时间</th><th class="cell-actions">操作</th></tr></thead><tbody data-resource-directory-file-rows></tbody></table><div class="source-empty-state" data-resource-directory-empty hidden><strong class="text-normal-bold">当前目录暂无资源</strong><span class="text-small">可向当前节点挂载文件、数据表或创建子文件夹。</span></div></div>
      </div>
      <div class="resource-directory-tab-panel resource-directory-permission-panel" data-directory-content-panel="permissions" hidden>
        <div class="directory-permission-toolbar"><div class="tabs tabs-dense" role="tablist" aria-label="权限对象类型"><button class="tabs-item is-active" type="button" role="tab" aria-selected="true" data-permission-subject-tab="user">用户</button><button class="tabs-item" type="button" role="tab" aria-selected="false" data-permission-subject-tab="group">用户组</button><button class="tabs-item" type="button" role="tab" aria-selected="false" data-permission-subject-tab="org">组织机构</button></div><label class="field directory-permission-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索名称或所属机构" aria-label="搜索权限对象" data-directory-permission-search/></span></label><span class="toolbar-spacer"></span><button class="btn btn-dense btn-primary" type="button" data-open-directory-permission>添加权限对象</button></div>
        <div class="table-wrap"><table class="table directory-permission-table"><thead><tr><th>名称</th><th>类型</th><th>所属机构 / 路径</th><th>权限</th><th>权限来源</th><th class="cell-actions">操作</th></tr></thead><tbody data-directory-permission-rows></tbody></table><div class="source-empty-state" data-directory-permission-empty hidden><strong class="text-normal-bold">暂无符合条件的权限对象</strong><span class="text-small">可切换对象类型或添加新对象。</span></div></div>
      </div>
    </section>
  </section>
  <div class="dialog-mask" data-resource-directory-dialog hidden><section class="dialog dialog-wide resource-directory-dialog" role="dialog" aria-modal="true" aria-labelledby="resource-directory-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="resource-directory-dialog-title" data-resource-directory-dialog-title>新建文件夹</h2><p class="dialog-description text-small" data-resource-directory-dialog-subtitle>在个人空间中创建自有文件夹</p></div><button class="dialog-close" type="button" aria-label="关闭" data-resource-directory-close></button></header><form data-resource-directory-form><div class="dialog-body resource-directory-form"><div class="folder-parent-summary"><span class="text-small">上级目录</span><strong class="text-normal-bold" data-resource-directory-parent>个人空间</strong><span class="tag tag-small" data-resource-directory-level>一级目录</span></div><div class="resource-directory-basic-fields"><label class="field"><span class="field-label">目录名称</span><span class="input-wrap input-middle"><input class="input" name="directoryName" maxlength="30" required placeholder="请输入目录名称" /></span></label><label class="field"><span class="field-label">描述</span><span class="input-wrap"><textarea class="input resource-directory-description-input" name="directoryDescription" rows="3" maxlength="120" required placeholder="说明目录的业务范围或文件用途"></textarea></span></label></div><fieldset class="resource-directory-permissions" data-team-directory-permissions hidden><legend class="text-normal-bold">权限配置</legend><label class="control resource-directory-inherit"><input class="checkbox" type="checkbox" name="inheritPermissions" data-inherit-directory-permissions /><span class="control-label">继承父目录权限</span><span class="text-small">新建子目录默认开启</span></label><div class="resource-directory-permission-grid"><label class="field"><span class="field-label">管理权限</span><span class="input-wrap input-middle"><input class="input" name="managePermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可管理目录、权限和成员。</span></label><label class="field"><span class="field-label">编辑权限</span><span class="input-wrap input-middle"><input class="input" name="editPermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可新增、修改和移动文件。</span></label><label class="field"><span class="field-label">查看权限</span><span class="input-wrap input-middle"><input class="input" name="viewPermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可查看目录和下载文件。</span></label></div></fieldset></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-resource-directory-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认创建</button></footer></form></section></div>
  <div class="dialog-mask" data-directory-permission-dialog hidden><section class="dialog directory-permission-dialog" role="dialog" aria-modal="true" aria-labelledby="directory-permission-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="directory-permission-dialog-title" data-permission-picker-title>添加用户</h2><p class="dialog-description text-small">从左侧选择权限对象，并在右侧为每个对象设置权限。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-directory-permission-close></button></header><form data-directory-permission-form><div class="dialog-body directory-permission-picker"><section class="permission-picker-pane" aria-labelledby="permission-candidate-title"><div class="permission-picker-pane-heading"><div><h3 class="text-normal-bold" id="permission-candidate-title">可选对象</h3><span class="text-small" data-permission-candidate-count>0 个结果</span></div><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索名称、账号或所属机构" aria-label="搜索可选权限对象" data-permission-candidate-search/></span></label></div><div class="permission-candidate-list" data-permission-candidates></div></section><section class="permission-picker-pane permission-selected-pane" aria-labelledby="permission-selected-title"><div class="permission-picker-pane-heading"><div><h3 class="text-normal-bold" id="permission-selected-title">已选择</h3><span class="text-small" data-permission-selected-count>0 个对象</span></div></div><div class="permission-selected-list" data-permission-selected></div></section></div><footer class="dialog-actions"><span class="dialog-action-note text-small" data-permission-picker-note>请至少选择一个权限对象</span><button class="btn btn-medium btn-secondary" type="button" data-directory-permission-close>取消</button><button class="btn btn-medium btn-primary" type="submit" data-confirm-directory-permission disabled>确认添加</button></footer></form></section></div>
  <div class="dialog-mask" data-directory-resource-dialog hidden><section class="dialog dialog-wide directory-resource-dialog" role="dialog" aria-modal="true" aria-labelledby="directory-resource-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="directory-resource-dialog-title">添加资源</h2><p class="dialog-description text-small">从文件中心或数据表中选择资源，挂载到“<span data-directory-resource-target>当前目录</span>”。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-directory-resource-close></button></header><form data-directory-resource-form><div class="dialog-body directory-resource-picker"><div class="tabs tabs-dense" role="tablist" aria-label="资源来源"><button class="tabs-item is-active" type="button" role="tab" aria-selected="true" data-directory-resource-type="file">文件中心</button><button class="tabs-item" type="button" role="tab" aria-selected="false" data-directory-resource-type="table">数据表</button></div><div class="directory-resource-picker-toolbar"><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索资源名称、类型或知识源" aria-label="搜索可添加资源" data-directory-resource-search /></span></label><span class="text-small" data-directory-resource-candidate-count>0 个结果</span></div><div class="table-wrap directory-resource-candidates"><table class="table"><thead><tr><th class="directory-resource-check"></th><th>资源名称</th><th>资源类型</th><th>来源</th><th>状态</th></tr></thead><tbody data-directory-resource-candidates></tbody></table><div class="source-empty-state" data-directory-resource-candidate-empty hidden><strong class="text-normal-bold">未找到可添加资源</strong><span class="text-small">可切换资源来源或调整搜索条件。</span></div></div></div><footer class="dialog-actions"><span class="dialog-action-note text-small" data-directory-resource-selected-count>请选择要添加的资源</span><button class="btn btn-medium btn-secondary" type="button" data-directory-resource-close>取消</button><button class="btn btn-medium btn-primary" type="submit" data-confirm-directory-resource disabled>确认添加</button></footer></form></section></div>
</template><script type="module" src="../assets/js/app.js?v=40"></script></body></html>
