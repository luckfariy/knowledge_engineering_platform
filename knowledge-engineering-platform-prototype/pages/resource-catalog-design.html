<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>资源目录管理 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=35" />
</head>
<body data-page="resource-catalog-design"><div data-shell></div><template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">资源目录管理</h1><p class="page-description text-normal">在个人空间管理自有文件夹，在团队空间按企业业务视角建立可继承权限的分类目录。</p></div></header>
  <section class="resource-directory-workbench" aria-label="资源目录与文件">
    <aside class="panel resource-directory-panel" aria-label="目录树">
      <div class="resource-directory-heading"><div><h2 class="panel-title text-medium-bold">目录树</h2><p class="panel-description text-small" data-directory-space-summary>管理我的文件夹</p></div><button class="btn btn-dense btn-primary" type="button" data-open-resource-directory>新建文件夹</button></div>
      <div class="tabs tabs-dense resource-directory-space-tabs" role="tablist" aria-label="切换空间"><button class="tabs-item is-active" type="button" role="tab" aria-selected="true" data-directory-space="team">团队空间</button><button class="tabs-item" type="button" role="tab" aria-selected="false" data-directory-space="personal">个人空间</button></div>
      <label class="field resource-directory-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索目录" aria-label="搜索目录" data-resource-directory-search /></span></label>
      <p class="resource-directory-note text-small" data-directory-space-note>个人目录仅由当前用户管理。</p>
      <nav class="resource-directory-tree" role="tree" aria-label="资源目录" data-resource-directory-tree></nav>
    </aside>
    <section class="panel resource-directory-files" aria-labelledby="resource-directory-files-title">
      <div class="resource-directory-file-heading"><div><div class="asset-file-path text-small"><button type="button" data-resource-directory-root>个人空间</button><span>/</span><span data-resource-directory-path>全部文件</span></div><h2 class="panel-title text-medium-bold" id="resource-directory-files-title" data-resource-directory-title>全部文件</h2><p class="panel-description text-small" data-resource-directory-description>展示个人空间中的全部文件</p></div><div class="directory-permission-summary" data-directory-permission-summary hidden><span class="tag tag-status tag-status-blue" data-directory-inherit-state>已继承</span><span class="text-small">管理 <strong data-directory-manage-count>0</strong> · 编辑 <strong data-directory-edit-count>0</strong> · 查看 <strong data-directory-view-count>0</strong></span></div></div>
      <div class="toolbar resource-directory-toolbar"><label class="field file-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件名称、类型或创建人" aria-label="搜索目录文件" data-resource-directory-file-search /></span></label><span class="toolbar-spacer"></span><span class="text-small" data-resource-directory-file-count>0 个文件</span></div>
      <div class="table-wrap"><table class="table" id="resource-directory-file-table"><thead><tr><th>文件名称</th><th>类型</th><th>所属目录</th><th>创建人</th><th>更新时间</th><th class="cell-actions">操作</th></tr></thead><tbody data-resource-directory-file-rows></tbody></table><div class="source-empty-state" data-resource-directory-empty hidden><strong class="text-normal-bold">当前目录暂无文件</strong><span class="text-small">可在对应空间中上传或移动文件。</span></div></div>
    </section>
  </section>
  <div class="dialog-mask" data-resource-directory-dialog hidden><section class="dialog dialog-wide resource-directory-dialog" role="dialog" aria-modal="true" aria-labelledby="resource-directory-dialog-title"><header class="dialog-header"><div><h2 class="dialog-title" id="resource-directory-dialog-title" data-resource-directory-dialog-title>新建文件夹</h2><p class="dialog-description text-small" data-resource-directory-dialog-subtitle>在个人空间中创建自有文件夹</p></div><button class="dialog-close" type="button" aria-label="关闭" data-resource-directory-close></button></header><form data-resource-directory-form><div class="dialog-body resource-directory-form"><div class="folder-parent-summary"><span class="text-small">上级目录</span><strong class="text-normal-bold" data-resource-directory-parent>个人空间</strong><span class="tag tag-small" data-resource-directory-level>一级目录</span></div><div class="resource-directory-basic-fields"><label class="field"><span class="field-label">目录名称</span><span class="input-wrap input-middle"><input class="input" name="directoryName" maxlength="30" required placeholder="请输入目录名称" /></span></label><label class="field"><span class="field-label">描述</span><span class="input-wrap"><textarea class="input resource-directory-description-input" name="directoryDescription" rows="3" maxlength="120" required placeholder="说明目录的业务范围或文件用途"></textarea></span></label></div><fieldset class="resource-directory-permissions" data-team-directory-permissions hidden><legend class="text-normal-bold">权限配置</legend><label class="control resource-directory-inherit"><input class="checkbox" type="checkbox" name="inheritPermissions" data-inherit-directory-permissions /><span class="control-label">继承父目录权限</span><span class="text-small">新建子目录默认开启</span></label><div class="resource-directory-permission-grid"><label class="field"><span class="field-label">管理权限</span><span class="input-wrap input-middle"><input class="input" name="managePermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可管理目录、权限和成员。</span></label><label class="field"><span class="field-label">编辑权限</span><span class="input-wrap input-middle"><input class="input" name="editPermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可新增、修改和移动文件。</span></label><label class="field"><span class="field-label">查看权限</span><span class="input-wrap input-middle"><input class="input" name="viewPermission" placeholder="输入用户或组织，逗号分隔" /></span><span class="field-hint text-small">可查看目录和下载文件。</span></label></div></fieldset></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-resource-directory-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认创建</button></footer></form></section></div>
</template><script type="module" src="../assets/js/app.js?v=36"></script></body></html>
