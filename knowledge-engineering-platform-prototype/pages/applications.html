<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>应用与 Agent - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css"/></head><body data-page="applications"><div data-shell></div><template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">知识应用与 Agent</h1><p class="page-description text-normal">将文档、向量、图谱、结构化数据、业务规则和系统工具组合为可控、可评测、可审计的业务知识应用。</p></div><div class="page-actions"><button class="btn btn-medium btn-secondary" data-toast="已打开场景应用模板库">应用模板</button><button class="btn btn-medium btn-primary" data-toast="Agent 创建向导已启动">创建 Agent</button></div></header>
  <section class="summary-strip"><div class="summary-item"><span class="summary-label text-small">运行中应用</span><strong class="text-number">18</strong></div><div class="summary-item"><span class="summary-label text-small">本月任务</span><strong class="text-number">1.46M</strong></div><div class="summary-item"><span class="summary-label text-small">任务完成率</span><strong class="text-number">96.8%</strong></div><div class="summary-item"><span class="summary-label text-small">人工审批拦截</span><strong class="text-number">326</strong></div></section>
  <section class="section"><div class="section-heading"><div><h2 class="section-title text-big-bold">业务知识应用</h2><span class="section-note text-small">按业务场景封装知识、模型、工具与评测集</span></div></div><div class="grid grid-3">
    <article class="panel agent-card"><div class="module-card-top"><div class="agent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14v12H5zM8 10h8m-8 4h5"/></svg></div><span class="tag tag-status tag-status-lime">已发布</span></div><div><h3 class="text-medium-bold">制度知识助手</h3><p class="text-normal">面向全行员工提供权限感知的制度搜索、问答、版本对比与原文引用。</p></div><div class="agent-meta"><span class="tag tag-small">RAG</span><span class="tag tag-small">统一语义图谱</span><span class="tag tag-small">Evidence</span></div><div class="module-card-footer"><span class="text-small text-number">82K 用户</span><button class="btn btn-dense btn-text" data-toast="已打开制度知识助手">进入应用</button></div></article>
    <article class="panel agent-card"><div class="module-card-top"><div class="agent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19h16M6 16V8h12v8M9 8V5h6v3"/></svg></div><span class="tag tag-status tag-status-blue">灰度运行</span></div><div><h3 class="text-medium-bold">授信审查助手</h3><p class="text-normal">结合制度、客户数据、风险规则和专题图谱，生成可追溯的审查要点和风险提示。</p></div><div class="agent-meta"><span class="tag tag-small">Graph</span><span class="tag tag-small">Rule</span><span class="tag tag-small">MCP</span><span class="tag tag-small">Human Gate</span></div><div class="module-card-footer"><span class="text-small text-number">2,486 任务</span><button class="btn btn-dense btn-text" data-toast="已打开授信审查助手运行监控">运行监控</button></div></article>
    <article class="panel agent-card"><div class="module-card-top"><div class="agent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 4 14 14M8 4h7l5 5v7M4 8v12h12"/></svg></div><span class="tag tag-status tag-status-secondary">配置中</span></div><div><h3 class="text-medium-bold">合同风险审查</h3><p class="text-normal">对标准合同、法律条款和历史风险案例进行差异比对，输出风险等级和修订建议。</p></div><div class="agent-meta"><span class="tag tag-small">专题图谱</span><span class="tag tag-small">Skill</span><span class="tag tag-small">工作流</span></div><div class="module-card-footer"><span class="text-small">待完成评测</span><button class="btn btn-dense btn-text" data-toast="已进入合同风险审查配置">继续配置</button></div></article>
  </div></section>
  <section class="section grid grid-main-aside"><article class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">Agent 构建流程</h2><p class="panel-description text-small">每个 Agent 都必须明确知识范围、工具权限、人工审批与效果评测</p></div></div><div class="lifecycle lifecycle-six"><button class="workflow-node is-current"><span class="workflow-number">01</span><strong>定义场景</strong><span class="workflow-meta text-small">目标与用户</span></button><button class="workflow-node"><span class="workflow-number">02</span><strong>选择知识</strong><span class="workflow-meta text-small">资产与图谱</span></button><button class="workflow-node"><span class="workflow-number">03</span><strong>配置能力</strong><span class="workflow-meta text-small">Prompt 与 Skill</span></button><button class="workflow-node"><span class="workflow-number">04</span><strong>编排工具</strong><span class="workflow-meta text-small">MCP 与 API</span></button><button class="workflow-node"><span class="workflow-number">05</span><strong>安全评测</strong><span class="workflow-meta text-small">权限与测试集</span></button><button class="workflow-node"><span class="workflow-number">06</span><strong>发布运营</strong><span class="workflow-meta text-small">版本与监控</span></button></div></article><aside class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">安全策略</h2><p class="panel-description text-small">行动型 Agent 默认启用</p></div></div><div class="quality-list"><label class="control"><input class="checkbox" type="checkbox" checked/><span class="control-label">继承用户知识权限</span></label><label class="control"><input class="checkbox" type="checkbox" checked/><span class="control-label">敏感操作人工审批</span></label><label class="control"><input class="checkbox" type="checkbox" checked/><span class="control-label">答案强制引用证据</span></label><label class="control"><input class="checkbox" type="checkbox" checked/><span class="control-label">保留完整执行审计</span></label></div></aside></section>
  </template><script type="module" src="../assets/js/platform.js"></script></body></html>
