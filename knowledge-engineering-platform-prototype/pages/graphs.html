<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>图谱构建 - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css"/></head><body data-page="graph"><div data-shell></div><template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">知识图谱构建与管理</h1><p class="page-description text-normal">选择已发布的实体、关系、事件、规则和文档资产，构建企业统一语义图谱或专题业务知识图谱。</p></div><div class="page-actions"><button class="btn btn-medium btn-secondary" data-toast="已打开本体模型库">本体模型</button><button class="btn btn-medium btn-primary" data-toast="新建图谱项目向导已启动">新建图谱项目</button></div></header>
  <section class="grid grid-2"><article class="module-card"><div class="module-card-top"><div><span class="tag tag-status tag-status-blue">企业级</span><h2 class="text-big-bold">统一语义知识图谱</h2></div><span class="module-index text-number">01</span></div><p class="text-normal">构建业务域、场景、活动、对象与术语的全局语义网络，统一跨系统业务语言和知识定位。</p><div class="summary-strip"><div class="summary-item"><span class="summary-label text-small">本体类</span><strong class="text-number">186</strong></div><div class="summary-item"><span class="summary-label text-small">实体</span><strong class="text-number">2.8M</strong></div><div class="summary-item"><span class="summary-label text-small">版本</span><strong class="text-number">v3.6</strong></div></div><div class="module-card-footer"><span class="tag tag-status tag-status-lime">已发布</span><button class="btn btn-dense btn-text" data-toast="已进入统一语义图谱工作台">进入工作台</button></div></article><article class="module-card"><div class="module-card-top"><div><span class="tag tag-status tag-status-secondary">业务场景</span><h2 class="text-big-bold">专题业务知识图谱</h2></div><span class="module-index text-number">02</span></div><p class="text-normal">面向授信、合同、客户、风险等具体场景组织细粒度事实、事件和规则，支撑分析与推理。</p><div class="summary-strip"><div class="summary-item"><span class="summary-label text-small">专题图谱</span><strong class="text-number">11</strong></div><div class="summary-item"><span class="summary-label text-small">事实关系</span><strong class="text-number">1.0M</strong></div><div class="summary-item"><span class="summary-label text-small">更新中</span><strong class="text-number">3</strong></div></div><div class="module-card-footer"><span class="tag tag-status tag-status-blue">持续更新</span><button class="btn btn-dense btn-text" data-toast="已打开专题图谱列表">查看专题</button></div></article></section>
  <section class="section grid grid-main-aside"><article class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">授信业务专题图谱</h2><p class="panel-description text-small">基于 86,420 项已发布知识资产构建 · 版本 v2.4</p></div><div class="page-actions"><button class="btn btn-dense btn-secondary" data-toast="已切换到图谱查询">图谱查询</button><button class="btn btn-dense btn-primary" data-toast="已进入可视化编辑模式">编辑图谱</button></div></div><div class="graph-preview" aria-label="授信业务专题图谱预览"><div class="graph-grid"></div><span class="graph-edge" style="left:24%;top:34%;width:24%;transform:rotate(12deg)"></span><span class="graph-edge" style="left:48%;top:43%;width:25%;transform:rotate(-18deg)"></span><span class="graph-edge" style="left:45%;top:48%;width:20%;transform:rotate(42deg)"></span><span class="graph-edge" style="left:28%;top:42%;width:18%;transform:rotate(70deg)"></span><span class="graph-node is-topic" style="left:39%;top:34%">授信审查</span><span class="graph-node" style="left:12%;top:20%">客户</span><span class="graph-node" style="left:70%;top:15%">授信产品</span><span class="graph-node is-rule" style="left:64%;top:67%">风险规则</span><span class="graph-node" style="left:18%;top:70%">担保方式</span><div class="graph-legend"><span class="tag tag-small">业务对象</span><span class="tag tag-small">业务活动</span><span class="tag tag-small">业务规则</span></div></div></article><aside class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">构图流程</h2><p class="panel-description text-small">基于已发布资产组织图谱</p></div></div><div class="steps steps-vertical"><div class="steps-item is-finish"><span class="steps-marker">1</span><div><strong>本体建模</strong><div class="text-small">已发布 v2.4</div></div></div><div class="steps-tail"></div><div class="steps-item is-finish"><span class="steps-marker">2</span><div><strong>资产选择与映射</strong><div class="text-small">86,420 项</div></div></div><div class="steps-tail"></div><div class="steps-item is-process"><span class="steps-marker">3</span><div><strong>图谱构建</strong><div class="text-small">入图进度 82%</div></div></div><div class="steps-tail"></div><div class="steps-item is-wait"><span class="steps-marker">4</span><div><strong>图谱校验</strong><div class="text-small">等待中</div></div></div><div class="steps-tail"></div><div class="steps-item is-wait"><span class="steps-marker">5</span><div><strong>审核发布</strong><div class="text-small">等待中</div></div></div></div></aside></section>
  </template><script type="module" src="../assets/js/platform.js"></script></body></html>
