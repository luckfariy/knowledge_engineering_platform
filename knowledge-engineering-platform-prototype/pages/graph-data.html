<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>图数据 - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css?v=2"/></head><body data-page="graph-data"><div data-shell></div><template data-page-template>
<header class="page-heading"><div><h1 class="page-title text-x-big-bold">图数据</h1><p class="page-description text-normal">纳管外部图数据库以及原始节点、边和属性数据，为后续知识加工提供输入。</p></div><div class="page-actions"><button class="btn btn-medium btn-secondary" data-toast="导入任务面板已打开">导入任务</button><button class="btn btn-medium btn-primary" data-toast="图数据源向导已打开">新建图数据源</button></div></header>
<section class="grid grid-4"><article class="metric-card"><div class="metric-label text-normal">图数据源</div><div class="metric-value text-x-big-bold text-number">6</div><div class="metric-foot text-small"><span>5 正常</span><span class="trend-risk">1 异常</span></div></article><article class="metric-card"><div class="metric-label text-normal">节点</div><div class="metric-value text-x-big-bold text-number">3.82M</div><div class="metric-foot text-small"><span>28 种节点类型</span></div></article><article class="metric-card"><div class="metric-label text-normal">边</div><div class="metric-value text-x-big-bold text-number">1.06M</div><div class="metric-foot text-small"><span>46 种关系类型</span></div></article><article class="metric-card"><div class="metric-label text-normal">质量问题</div><div class="metric-value text-x-big-bold text-number">18</div><div class="metric-foot text-small"><span class="trend-risk">孤立节点与缺失属性</span></div></article></section>
<section class="section panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">图数据源</h2><p class="panel-description text-small">详情页内承载连接配置、模式识别、数据预览、同步、质量和权限</p></div></div><div class="toolbar"><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索图数据源" data-table-search="#graph-list"/></span></label><div class="toolbar-spacer"></div><button class="btn btn-dense btn-secondary" data-toast="图数据库类型筛选已打开">类型：全部</button></div><div class="table-wrap"><table class="table" id="graph-list"><thead><tr><th>图数据源</th><th>类型</th><th>节点</th><th>边</th><th>同步方式</th><th>最近同步</th><th>状态</th><th class="cell-actions">操作</th></tr></thead><tbody><tr><td class="cell-primary">客户关系图<span class="cell-secondary text-small">客户与企业关联网络</span></td><td>Neo4j</td><td class="text-number">2.18M</td><td class="text-number">684K</td><td>实时</td><td>刚刚</td><td><span class="tag tag-status tag-status-lime">正常</span></td><td class="cell-actions"><button class="btn btn-dense btn-text" data-toast="已打开图数据源详情">查看</button></td></tr><tr><td class="cell-primary">产品关系库<span class="cell-secondary text-small">产品、条款与业务关系</span></td><td>JanusGraph</td><td class="text-number">860K</td><td class="text-number">246K</td><td>每小时</td><td>18 分钟前</td><td><span class="tag tag-status tag-status-red">同步失败</span></td><td class="cell-actions"><button class="btn btn-dense btn-text" data-toast="已打开失败任务">处理</button></td></tr><tr><td class="cell-primary">组织机构关系<span class="cell-secondary text-small">机构、岗位和人员关系</span></td><td>CSV 图数据</td><td class="text-number">780K</td><td class="text-number">130K</td><td>每日</td><td>今日 06:00</td><td><span class="tag tag-status tag-status-lime">正常</span></td><td class="cell-actions"><button class="btn btn-dense btn-text" data-toast="已打开图数据源详情">查看</button></td></tr></tbody></table></div></section>
