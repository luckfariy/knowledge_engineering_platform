<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>个人空间 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=30" />
</head>
<body data-page="documents-personal">
  <div data-shell></div>
  <template data-page-template>
      <div class="space-tab-panel" id="personal-space-panel">
        <section class="document-workbench space-card-workbench" aria-label="个人空间文件管理">
          <aside class="panel personal-folder-panel space-directory-card" aria-label="个人空间文件夹">
            <div class="folder-panel-header"><h2 class="text-medium-bold">文件夹</h2><button class="icon-button" type="button" aria-label="新建个人文件夹" data-open-personal-folder><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h6l2 2h8v11H4z"/><path d="M12 11v5m-2.5-2.5h5"/></svg></button></div>
            <label class="field folder-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件夹" aria-label="搜索个人空间文件夹" data-folder-search /></span></label>
            <nav class="personal-folder-tree" aria-label="个人文件夹目录">
              <section class="folder-root-group">
                <button class="folder-root is-expanded" type="button" aria-expanded="true" data-folder-root><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m8 10 4 4 4-4"/><path d="M3 6h7l2 2h9v11H3z"/></svg><span>我的文件夹</span><span class="source-count">96</span></button>
                <div class="folder-children"><button class="personal-folder-item is-active" type="button" data-personal-folder="all" aria-pressed="true"><span>全部文件</span><span class="source-count">96</span></button></div>
              </section>
              <section class="folder-root-group">
                <button class="folder-root is-expanded" type="button" aria-expanded="true" data-folder-root><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c.5-4 2.5-6 5.5-6s5 2 5.5 6M14 15c3.5 0 5.5 1.5 6 4.5"/></svg><span>共享文件夹</span><span class="source-count">32</span></button>
                <div class="folder-children"><button class="personal-folder-item" type="button" data-personal-folder="shared-project" aria-pressed="false"><span>零售项目资料</span><span class="tag tag-small">李程共享</span></button><button class="personal-folder-item" type="button" data-personal-folder="shared-policy" aria-pressed="false"><span>制度研究资料</span><span class="tag tag-small">王翠共享</span></button></div>
              </section>
            </nav>
          </aside>
          <div class="panel personal-file-panel space-list-card">
            <div class="personal-file-header"><div><h2 class="text-medium-bold" data-personal-folder-title>全部文件</h2><p class="text-small">个人空间中的文件及他人共享给我的文件</p></div><div class="page-actions"><input class="visually-hidden" type="file" multiple data-local-file-input aria-label="选择要上传的个人文件" /><button class="btn btn-medium btn-primary" type="button" data-local-upload><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v5h14v-5"/></svg>上传文件</button></div></div>
            <div class="toolbar personal-file-toolbar"><label class="field file-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件名称、类型或创建人" data-table-search="#personal-document-table" aria-label="搜索个人文件" /></span></label><div class="toolbar-spacer"></div><span class="text-small file-result-count" data-file-count>7 条结果</span></div>
            <div class="table-wrap"><table class="table personal-file-table" id="personal-document-table"><thead><tr><th>文件名称</th><th>文件类型</th><th>状态</th><th>版本</th><th>创建时间</th><th>更新时间</th><th>创建人</th><th class="cell-actions">操作</th></tr></thead><tbody>
              <tr data-personal-folder-row="work"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=客户需求调研记录">客户需求调研记录</a><span class="cell-secondary text-small">DOCX · 2.4 MB</span></td><td>DOCX</td><td><span class="tag tag-status tag-status-secondary">仅自己</span></td><td class="text-number">v2.1</td><td>2026-08-12 09:30</td><td>2026-09-02 16:42</td><td>当前用户</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-open-share-dialog>分享</button><button class="btn btn-dense btn-text" data-update-file>更新</button></td></tr>
              <tr data-personal-folder-row="work"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=知识工程产品规划">知识工程产品规划</a><span class="cell-secondary text-small">PPTX · 8.6 MB</span></td><td>PPTX</td><td><span class="tag tag-status tag-status-blue">已共享</span></td><td class="text-number">v3.0</td><td>2026-07-21 10:18</td><td>2026-09-01 11:26</td><td>当前用户</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-open-share-dialog>分享</button><button class="btn btn-dense btn-text" data-update-file>更新</button></td></tr>
              <tr data-personal-folder-row="study"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=知识图谱学习笔记">知识图谱学习笔记</a><span class="cell-secondary text-small">PDF · 4.2 MB</span></td><td>PDF</td><td><span class="tag tag-status tag-status-secondary">仅自己</span></td><td class="text-number">v1.4</td><td>2026-06-08 14:18</td><td>2026-08-30 09:18</td><td>当前用户</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-open-share-dialog>分享</button><button class="btn btn-dense btn-text" data-update-file>更新</button></td></tr>
              <tr data-personal-folder-row="draft"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=未整理会议纪要">未整理会议纪要</a><span class="cell-secondary text-small">DOCX · 936 KB</span></td><td>DOCX</td><td><span class="tag tag-status tag-status-secondary">仅自己</span></td><td class="text-number">v1.0</td><td>2026-08-20 11:06</td><td>2026-08-29 17:24</td><td>当前用户</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-open-share-dialog>分享</button><button class="btn btn-dense btn-text" data-update-file>更新</button></td></tr>
              <tr data-personal-folder-row="shared-project"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=零售项目实施方案">零售项目实施方案</a><span class="cell-secondary text-small">PDF · 6.8 MB</span></td><td>PDF</td><td><span class="tag tag-status tag-status-blue">他人共享</span></td><td class="text-number">v2.6</td><td>2026-05-16 17:24</td><td>2026-08-28 10:20</td><td>李程</td><td class="cell-actions"><button class="btn btn-dense btn-text" data-toast="已打开文件详情">查看</button></td></tr>
              <tr data-personal-folder-row="shared-policy"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=数据治理制度研究">数据治理制度研究</a><span class="cell-secondary text-small">PDF · 3.1 MB</span></td><td>PDF</td><td><span class="tag tag-status tag-status-blue">他人共享</span></td><td class="text-number">v1.2</td><td>2025-01-08 10:20</td><td>2026-08-26 15:40</td><td>王翠</td><td class="cell-actions"><button class="btn btn-dense btn-text" data-toast="已打开文件详情">查看</button></td></tr>
              <tr data-personal-folder-row="study"><td class="cell-primary"><a class="document-link" href="personal-file-detail.html?file=大模型应用案例">大模型应用案例</a><span class="cell-secondary text-small">XLSX · 1.7 MB</span></td><td>XLSX</td><td><span class="tag tag-status tag-status-blue">已共享</span></td><td class="text-number">v1.8</td><td>2026-07-18 14:18</td><td>2026-08-25 14:18</td><td>当前用户</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-open-share-dialog>分享</button><button class="btn btn-dense btn-text" data-update-file>更新</button></td></tr>
            </tbody></table></div>
          </div>
        </section>
      </div>
    <div class="dialog-mask" data-share-dialog hidden>
      <div class="dialog dialog-form people-dialog" role="dialog" aria-modal="true" aria-labelledby="share-dialog-title">
        <div class="dialog-header"><h2 class="dialog-title" id="share-dialog-title">分享给其他用户</h2><button class="dialog-close" type="button" aria-label="关闭" data-close-share-dialog></button></div>
        <form data-share-form>
          <div class="dialog-body form-stack">
            <p class="people-dialog-note text-small">文件“<span data-share-file-name></span>”仍归你所有，可同时分享给多个用户。</p>
            <label class="field"><span class="field-label">搜索用户</span><span class="input-wrap input-middle"><input class="input" type="search" placeholder="输入姓名、部门或岗位" data-share-search /></span></label>
            <fieldset class="people-picker"><legend class="visually-hidden">选择文件分享用户</legend><div class="people-picker-list" data-share-options>
              <label class="people-option"><input class="checkbox" type="checkbox" name="shareUser" value="李程" /><span class="people-avatar">李</span><span><strong>李程</strong><small>公司金融部 · 客户经理</small></span></label>
              <label class="people-option"><input class="checkbox" type="checkbox" name="shareUser" value="王翠" /><span class="people-avatar">王</span><span><strong>王翠</strong><small>合规管理部 · 合规经理</small></span></label>
              <label class="people-option"><input class="checkbox" type="checkbox" name="shareUser" value="陈曦" /><span class="people-avatar">陈</span><span><strong>陈曦</strong><small>授信审批部 · 授信审批人</small></span></label>
              <label class="people-option"><input class="checkbox" type="checkbox" name="shareUser" value="孙悦" /><span class="people-avatar">孙</span><span><strong>孙悦</strong><small>数据管理部 · 数据标准专员</small></span></label>
            </div></fieldset>
          </div>
          <div class="dialog-actions people-dialog-actions"><span class="text-small" data-share-selected-count>已选择 0 人</span><button class="btn btn-medium btn-secondary" type="button" data-close-share-dialog>取消</button><button class="btn btn-medium btn-primary" type="submit" data-confirm-share disabled>确认分享</button></div>
        </form>
      </div>
    </div>

    <div class="dialog-mask" data-personal-folder-dialog hidden>
      <section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="personal-folder-dialog-title">
        <header class="dialog-header"><div><h2 class="dialog-title" id="personal-folder-dialog-title" data-personal-folder-dialog-title>新建文件夹</h2><p class="dialog-description text-small">在“<span data-personal-folder-parent>我的文件夹</span>”下创建文件夹。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-personal-folder-close></button></header>
        <form data-personal-folder-form><div class="dialog-body"><label class="field"><span class="field-label">文件夹名称</span><span class="input-wrap input-middle"><input class="input" name="personalFolderName" maxlength="30" required placeholder="请输入文件夹名称" /></span></label></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-personal-folder-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认创建</button></footer></form>
      </section>
    </div>

    <div class="dialog-mask" data-file-action-dialog hidden>
      <div class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="file-action-dialog-title">
        <div class="dialog-header"><h2 class="dialog-title" id="file-action-dialog-title" data-file-action-title>文件操作</h2><button class="dialog-close" type="button" aria-label="关闭" data-close-file-action-dialog></button></div>
        <form data-file-action-form>
          <div class="dialog-body form-stack">
            <p class="people-dialog-note text-small" data-file-action-description></p>
            <label class="field" data-rename-field hidden><span class="field-label">文件名称</span><span class="input-wrap input-middle"><input class="input" name="fileName" required /></span></label>
            <label class="field" data-move-field hidden><span class="field-label">目标文件夹</span><span class="input-wrap input-middle"><select class="input" name="targetFolder" required data-target-folder></select></span></label>
          </div>
          <div class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-close-file-action-dialog>取消</button><button class="btn btn-medium btn-primary" type="submit" data-confirm-file-action>确认</button></div>
        </form>
      </div>
    </div>

    <input class="visually-hidden" type="file" data-file-version-input aria-label="选择新版本文件" />
  </template>
  <script type="module" src="../assets/js/app.js?v=44"></script>
</body>
</html>
