<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>企业空间 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=23" />
</head>
<body data-page="documents-enterprise">
  <div data-shell></div>
  <template data-page-template>
      <div class="document-tab-panel" id="resource-management-panel">
        <section class="document-workbench resource-workbench" aria-label="目录与资源管理">
          <aside class="source-panel panel" aria-label="资源目录">
            <div class="source-panel-header">
              <div><h2 class="panel-title text-medium-bold">资源目录树</h2><p class="panel-description text-small"><span data-directory-tree-count>3</span> 棵目录树 · 126 个文档</p></div>
              <div class="directory-header-actions"><button class="btn btn-dense btn-secondary" type="button" data-new-directory>新建目录</button><button class="btn btn-dense btn-primary" type="button" data-new-directory-tree>新建目录树</button></div>
            </div>
            <div class="directory-tree-switcher" role="tablist" aria-label="选择资源目录树">
              <button class="directory-tree-tab is-active" type="button" role="tab" aria-selected="true" data-directory-tree-tab="organization">组织目录</button>
              <button class="directory-tree-tab" type="button" role="tab" aria-selected="false" data-directory-tree-tab="business">业务目录</button>
              <button class="directory-tree-tab" type="button" role="tab" aria-selected="false" data-directory-tree-tab="source-system">系统目录</button>
            </div>
            <p class="directory-tree-note text-small"><strong data-current-directory-tree>组织目录</strong><span>新文档默认进入“组织目录 / 待归类”</span></p>
            <nav class="directory-tree" aria-label="组织目录" data-directory-tree="organization">
              <button class="directory-item is-active" type="button" data-directory-filter="all" aria-pressed="true"><span class="directory-caret" aria-hidden="true">›</span><span>全部资源</span><span class="source-count">126</span></button>
              <button class="directory-item" type="button" data-directory-filter="risk-management" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>风险管理部</span><span class="source-count">42</span></button>
              <button class="directory-item" type="button" data-directory-filter="company-finance" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>公司金融部</span><span class="source-count">31</span></button>
              <button class="directory-item" type="button" data-directory-filter="legal-compliance" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>法律合规部</span><span class="source-count">28</span></button>
              <button class="directory-item" type="button" data-directory-filter="retail-finance" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>零售金融部</span><span class="source-count">22</span></button>
              <button class="directory-item" type="button" data-directory-filter="unassigned" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>待归类</span><span class="source-count">3</span></button>
            </nav>
            <nav class="directory-tree" aria-label="业务目录" data-directory-tree="business" hidden>
              <button class="directory-item is-active" type="button" data-directory-filter="all" aria-pressed="true"><span class="directory-caret" aria-hidden="true">›</span><span>全部资源</span><span class="source-count">126</span></button>
              <button class="directory-item" type="button" data-directory-filter="credit" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>授信管理</span><span class="source-count">44</span></button>
              <button class="directory-item" type="button" data-directory-filter="risk" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>风险管理</span><span class="source-count">29</span></button>
              <button class="directory-item" type="button" data-directory-filter="contract" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>合同管理</span><span class="source-count">21</span></button>
              <button class="directory-item" type="button" data-directory-filter="customer-service" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>客户服务</span><span class="source-count">32</span></button>
            </nav>
            <nav class="directory-tree" aria-label="系统目录" data-directory-tree="source-system" hidden>
              <button class="directory-item is-active" type="button" data-directory-filter="all" aria-pressed="true"><span class="directory-caret" aria-hidden="true">›</span><span>全部资源</span><span class="source-count">126</span></button>
              <button class="directory-item" type="button" data-directory-filter="local" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>本地上传</span><span class="source-count">26</span></button>
              <button class="directory-item" type="button" data-directory-filter="feishu" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>飞书知识库</span><span class="source-count">38</span></button>
              <button class="directory-item" type="button" data-directory-filter="lexiang" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>乐享知识库</span><span class="source-count">25</span></button>
              <button class="directory-item" type="button" data-directory-filter="wiki" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>Wiki 连接器</span><span class="source-count">22</span></button>
              <button class="directory-item" type="button" data-directory-filter="yuque" aria-pressed="false"><span class="directory-caret" aria-hidden="true">›</span><span>语雀知识库</span><span class="source-count">15</span></button>
            </nav>
            <form class="new-directory-form" data-directory-form hidden>
              <label class="field"><span class="field-label">目录名称</span><span class="input-wrap input-middle"><input class="input" name="directoryName" required placeholder="输入目录名称" /></span></label>
              <div class="inline-actions"><button class="btn btn-dense btn-secondary" type="button" data-cancel-directory>取消</button><button class="btn btn-dense btn-primary" type="submit">创建</button></div>
            </form>
            <form class="new-directory-form" data-directory-tree-form hidden>
              <label class="field"><span class="field-label">目录树名称</span><span class="input-wrap input-middle"><input class="input" name="directoryTreeName" required placeholder="例如：产品目录" /></span></label>
              <label class="field"><span class="field-label">目录树类型</span><span class="select-wrap select-middle"><select class="select" name="directoryTreeType"><option value="organization">组织目录</option><option value="business">业务目录</option><option value="source-system">系统目录</option></select></span></label>
              <div class="inline-actions"><button class="btn btn-dense btn-secondary" type="button" data-cancel-directory-tree>取消</button><button class="btn btn-dense btn-primary" type="submit">创建</button></div>
            </form>
          </aside>

          <div class="file-panel panel">
            <div class="file-panel-header">
              <div><h2 class="panel-title text-medium-bold" data-resource-title>全部资源</h2><p class="panel-description text-small" data-resource-summary>统一管理目录内的文档与扩展属性</p></div>
              <div class="page-actions"><button class="btn btn-dense btn-secondary" type="button" data-open-attributes>扩展属性</button><button class="btn btn-dense btn-primary" type="button" data-auto-catalog>资源自动入目</button></div>
            </div>
            <div class="toolbar file-toolbar"><label class="field file-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文档名称、类型或创建人" data-table-search="#resource-table" aria-label="搜索资源文档" /></span></label><div class="toolbar-spacer"></div><span class="text-small file-result-count" data-resource-count>6 条结果</span></div>
            <div class="table-wrap">
              <table class="table" id="resource-table">
                <thead><tr><th>文件名称</th><th>文件类型</th><th>文件来源</th><th>状态</th><th>版本</th><th>元数据完整度</th><th>创建人</th><th>创建时间</th></tr></thead>
                <tbody>
                  <tr data-organization="risk-management" data-business="credit" data-source-system="local"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=对公授信审查办法">对公授信审查办法</a></td><td>PDF</td><td>本地上传</td><td><span class="tag tag-status tag-status-lime">已发布</span></td><td class="text-number">v3.2</td><td><div class="metadata-completeness"><span class="text-number">10/10</span><div class="metadata-progress"><span data-bar="100"></span></div><small>100%</small></div></td><td>王翠</td><td>2026-08-12 09:30</td></tr>
                  <tr data-organization="company-finance" data-business="credit" data-source-system="feishu"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=固定资产贷款管理办法">固定资产贷款管理办法</a></td><td>DOCX</td><td>飞书知识库</td><td><span class="tag tag-status tag-status-secondary">未发布</span></td><td class="text-number">v2.0</td><td><div class="metadata-completeness"><span class="text-number">7/10</span><div class="metadata-progress"><span data-bar="70"></span></div><small>70%</small></div></td><td>李程</td><td>2026-07-21 10:18</td></tr>
                  <tr data-organization="risk-management" data-business="risk" data-source-system="wiki"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=信用风险管理问答库">信用风险管理问答库</a></td><td>XLSX</td><td>Wiki 连接器</td><td><span class="tag tag-status tag-status-lime">已发布</span></td><td class="text-number">v1.8</td><td><div class="metadata-completeness"><span class="text-number">9/10</span><div class="metadata-progress"><span data-bar="90"></span></div><small>90%</small></div></td><td>陈曦</td><td>2026-06-08 14:18</td></tr>
                  <tr data-organization="legal-compliance" data-business="contract" data-source-system="lexiang"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=合同审查操作指引">合同审查操作指引</a></td><td>PDF</td><td>乐享知识库</td><td><span class="tag tag-status tag-status-secondary">未发布</span></td><td class="text-number">v1.1</td><td><div class="metadata-completeness"><span class="text-number">6/10</span><div class="metadata-progress"><span data-bar="60"></span></div><small>60%</small></div></td><td>刘敏</td><td>2026-08-20 11:06</td></tr>
                  <tr data-organization="retail-finance" data-business="customer-service" data-source-system="yuque"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=零售客户分级规则">零售客户分级规则</a></td><td>DOCX</td><td>语雀知识库</td><td><span class="tag tag-status tag-status-lime">已发布</span></td><td class="text-number">v4.0</td><td><div class="metadata-completeness"><span class="text-number">8/10</span><div class="metadata-progress"><span data-bar="80"></span></div><small>80%</small></div></td><td>赵楠</td><td>2026-05-16 17:24</td></tr>
                  <tr data-organization="unassigned" data-business="customer-service" data-source-system="local"><td class="cell-primary"><a class="document-link" href="resource-detail.html?file=客户信息查询常见问题">客户信息查询常见问题</a></td><td>PDF</td><td>本地上传</td><td><span class="tag tag-status tag-status-secondary">已归档</span></td><td class="text-number">v1.0</td><td><div class="metadata-completeness"><span class="text-number">10/10</span><div class="metadata-progress"><span data-bar="100"></span></div><small>100%</small></div></td><td>周俊</td><td>2026-03-29 10:12</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </section>

      </div>
    <div class="dialog-mask" data-attribute-dialog hidden>
      <div class="dialog dialog-wide attribute-dialog" role="dialog" aria-modal="true" aria-labelledby="attribute-dialog-title">
        <div class="dialog-header"><h2 class="dialog-title" id="attribute-dialog-title">扩展属性</h2><button class="dialog-close" type="button" aria-label="关闭" data-close-attributes></button></div>
        <div class="dialog-body">
          <p class="attribute-dialog-note text-normal">为资源增加业务或管理维度的自定义属性。请先选择属性分类，再在表格中完成配置。</p>
          <form data-attribute-form>
            <div class="attribute-category-row" role="group" aria-label="属性分类">
              <span class="attribute-category-label text-normal-bold">属性分类</span>
              <button class="tag tag-primary attribute-category is-active" type="button" data-attribute-category="业务属性" aria-pressed="true">业务属性</button>
              <button class="tag attribute-category" type="button" data-attribute-category="管理属性" aria-pressed="false">管理属性</button>
            </div>
            <div class="table-wrap attribute-table-wrap">
              <table class="table attribute-table">
                <thead><tr><th>属性名称</th><th>数据类型</th><th class="cell-actions">操作</th></tr></thead>
                <tbody data-attribute-rows>
                  <tr data-attribute-row><td><span class="input-wrap input-middle"><input class="input" name="attributeName" aria-label="属性名称" placeholder="输入属性名称" /></span></td><td><span class="input-wrap input-middle"><select class="input" name="attributeType" aria-label="数据类型"><option>文本</option><option>数字</option><option>日期</option><option>单选</option><option>多选</option></select></span></td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-remove-attribute-row>删除</button></td></tr>
                </tbody>
              </table>
            </div>
            <button class="btn btn-dense btn-text attribute-add-row" type="button" data-add-attribute-row>+添加属性</button>
          </form>
        </div>
        <div class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-close-attributes>取消</button><button class="btn btn-medium btn-primary" type="button" data-save-attribute>保存</button></div>
      </div>
    </div>
    <input class="visually-hidden" type="file" data-file-version-input aria-label="选择新版本文件" />
  </template>
  <script type="module" src="../assets/js/app.js?v=23"></script>
</body>
</html>
