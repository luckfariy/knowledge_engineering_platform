<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>用户与组织 - 系统配置</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css?v=6"/></head>
<body data-page="system-user-org"><div data-shell></div><template data-page-template>
  <header class="settings-page-heading"><div><p class="settings-breadcrumb text-small">系统配置 / 用户与组织</p><h2 class="text-x-big-bold">用户与组织</h2><p class="text-normal">维护组织结构、成员归属，以及组织和个人的产品功能权限。</p></div><div class="page-actions"><button class="btn btn-medium btn-secondary" type="button" data-toast="组织架构已同步">同步组织架构</button><button class="btn btn-medium btn-primary" type="button" data-toast="已打开新增用户流程">新增用户</button></div></header>
  <section class="org-workbench">
    <aside class="org-tree-panel" aria-label="组织机构树">
      <div class="org-panel-heading"><div><h3 class="text-medium-bold">组织机构</h3><span class="text-small">8 个部门 · 126 名用户</span></div><button class="btn btn-dense btn-text" type="button" data-toast="已打开新建组织流程">+ 新建</button></div>
      <label class="org-search"><span class="input-wrap"><input class="input" type="search" placeholder="搜索组织" aria-label="搜索组织机构" data-org-search/></span></label>
      <div class="org-tree" role="tree" data-org-tree>
        <button class="org-tree-item org-tree-root" type="button" role="treeitem" aria-expanded="true" data-org-name="海致科技集团" data-org-code="HZ-001" data-org-leader="陈宇" data-org-count="126"><span>⌄</span><strong>海致科技集团</strong><small>126</small></button>
        <div role="group">
          <button class="org-tree-item is-active" type="button" role="treeitem" aria-selected="true" data-org-name="知识产品中心" data-org-code="ORG-KP-01" data-org-leader="李晨" data-org-count="28"><span></span><strong>知识产品中心</strong><small>28</small></button>
          <button class="org-tree-item" type="button" role="treeitem" aria-selected="false" data-org-name="数据智能中心" data-org-code="ORG-DI-02" data-org-leader="王珊" data-org-count="34"><span></span><strong>数据智能中心</strong><small>34</small></button>
          <button class="org-tree-item" type="button" role="treeitem" aria-selected="false" data-org-name="交付服务中心" data-org-code="ORG-DS-03" data-org-leader="周铭" data-org-count="41"><span></span><strong>交付服务中心</strong><small>41</small></button>
          <button class="org-tree-item" type="button" role="treeitem" aria-selected="false" data-org-name="运营管理中心" data-org-code="ORG-OM-04" data-org-leader="赵楠" data-org-count="23"><span></span><strong>运营管理中心</strong><small>23</small></button>
        </div>
      </div>
    </aside>
    <article class="org-detail-panel">
      <header class="org-detail-header"><div><div class="org-title-row"><span class="org-avatar">知</span><div><h3 class="text-big-bold" data-org-title>知识产品中心</h3><p class="text-small"><span data-org-code>ORG-KP-01</span> · 负责人 <span data-org-leader>李晨</span></p></div></div></div><div class="org-stat"><strong class="text-x-big-bold text-number" data-org-count>28</strong><span class="text-small">组织成员</span></div></header>
      <div class="org-detail-tabs" data-tabs>
        <div class="tabs tabs-dense" role="tablist" aria-label="组织详情"><button class="tabs-item is-active" type="button" role="tab" aria-selected="true" aria-controls="org-users-panel">用户列表</button><button class="tabs-item" type="button" role="tab" aria-selected="false" aria-controls="org-permissions-panel">权限管理</button></div>
        <section id="org-users-panel" class="tabs-panel" role="tabpanel">
          <div class="org-toolbar"><div><h4 class="text-medium-bold">组织用户</h4><p class="text-small">用户默认继承当前组织的产品功能权限，可在此追加个人权限。</p></div><label class="user-search"><span class="input-wrap"><input class="input" type="search" placeholder="搜索姓名或账号" aria-label="搜索组织用户" data-table-search="#org-user-table"/></span></label></div>
          <div class="table-wrap"><table class="table" id="org-user-table"><thead><tr><th>用户</th><th>角色</th><th>权限来源</th><th>状态</th><th>操作</th></tr></thead><tbody>
            <tr><td class="cell-primary"><span class="settings-user"><span class="settings-user-avatar">李</span><span><strong>李晨</strong><small class="cell-secondary text-small">lichen@haizhi.com</small></span></span></td><td>组织负责人</td><td><span class="permission-origin"><span class="tag tag-small">继承组织</span></span></td><td><span class="tag tag-status tag-status-lime">正常</span></td><td><button class="btn btn-dense btn-text" type="button" data-user-grant="李晨">单独授权</button></td></tr>
            <tr><td class="cell-primary"><span class="settings-user"><span class="settings-user-avatar">林</span><span><strong>林晓</strong><small class="cell-secondary text-small">linxiao@haizhi.com</small></span></span></td><td>产品经理</td><td><span class="permission-origin"><span class="tag tag-small">继承组织</span><span class="tag tag-status tag-status-blue">+ 3 项个人授权</span></span></td><td><span class="tag tag-status tag-status-lime">正常</span></td><td><button class="btn btn-dense btn-text" type="button" data-user-grant="林晓">管理授权</button></td></tr>
            <tr><td class="cell-primary"><span class="settings-user"><span class="settings-user-avatar">方</span><span><strong>方悦</strong><small class="cell-secondary text-small">fangyue@haizhi.com</small></span></span></td><td>知识工程师</td><td><span class="permission-origin"><span class="tag tag-small">继承组织</span></span></td><td><span class="tag tag-status tag-status-lime">正常</span></td><td><button class="btn btn-dense btn-text" type="button" data-user-grant="方悦">单独授权</button></td></tr>
            <tr><td class="cell-primary"><span class="settings-user"><span class="settings-user-avatar">许</span><span><strong>许文</strong><small class="cell-secondary text-small">xuwen@haizhi.com</small></span></span></td><td>审核专员</td><td><span class="permission-origin"><span class="tag tag-small">继承组织</span><span class="tag tag-status tag-status-blue">+ 1 项个人授权</span></span></td><td><span class="tag tag-status tag-status-secondary">已停用</span></td><td><button class="btn btn-dense btn-text" type="button" data-user-grant="许文">管理授权</button></td></tr>
          </tbody></table></div>
        </section>
        <section id="org-permissions-panel" class="tabs-panel" role="tabpanel" hidden>
          <div class="permission-summary"><div><h4 class="text-medium-bold">组织产品功能权限</h4><p class="text-small">保存后自动成为本组织及下级组织用户的默认权限。</p></div><div><span class="tag tag-status tag-status-blue">已选 30 / 38 项</span><button class="btn btn-medium btn-primary" type="button" data-toast="组织权限已保存">保存权限</button></div></div>
          <div class="permission-legend text-small"><span><i class="legend-dot legend-dot-org"></i>组织默认权限</span><span>层级：一级模块 / 二级页面 / 页面按钮</span></div>
          <div class="permission-matrix" data-permission-matrix>
            <article class="permission-module"><header><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label text-medium-bold">资源纳管</span></label><span class="text-small">12 / 14 项</span></header><div class="permission-pages"><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">文件中心</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox" checked/>上传</label><label><input type="checkbox" checked/>编辑</label><label><input type="checkbox"/>删除</label></span></div><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">数据表</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox" checked/>接入</label><label><input type="checkbox" checked/>同步</label></span></div><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">图数据</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox"/>导出</label></span></div></div></article>
            <article class="permission-module"><header><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label text-medium-bold">知识生产</span></label><span class="text-small">10 / 12 项</span></header><div class="permission-pages"><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">模型加工</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox" checked/>新建</label><label><input type="checkbox"/>发布</label></span></div><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">加工任务</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox" checked/>创建</label><label><input type="checkbox" checked/>确认结果</label></span></div></div></article>
            <article class="permission-module"><header><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label text-medium-bold">知识资产</span></label><span class="text-small">8 / 12 项</span></header><div class="permission-pages"><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">语义知识图谱</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox" checked/>编辑</label><label><input type="checkbox"/>发布</label></span></div><div><label class="control"><span class="checkbox"><input type="checkbox" checked/><span class="checkbox-mark"></span></span><span class="control-label">知识库</span></label><span class="permission-actions"><label><input type="checkbox" checked/>查看</label><label><input type="checkbox"/>审核</label><label><input type="checkbox"/>下线</label></span></div></div></article>
          </div>
        </section>
      </div>
    </article>
  </section>
  <div class="dialog-mask" data-user-grant-dialog hidden><section class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="user-grant-title"><header class="dialog-header"><div><h3 id="user-grant-title" class="text-big-bold">用户单独授权</h3><p class="text-small"><span data-grant-user>当前用户</span>将继续继承组织权限，下列权限仅作为额外补充。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-close-user-grant></button></header><div class="dialog-body"><div class="grant-notice text-small"><strong>权限计算规则</strong><span>最终权限 = 组织默认权限 + 用户额外授权</span></div><div class="user-grant-grid"><label class="control"><span class="checkbox"><input type="checkbox"/><span class="checkbox-mark"></span></span><span class="control-label">资源纳管 / 文件中心 / 删除</span></label><label class="control"><span class="checkbox"><input type="checkbox"/><span class="checkbox-mark"></span></span><span class="control-label">知识生产 / 模型加工 / 发布</span></label><label class="control"><span class="checkbox"><input type="checkbox"/><span class="checkbox-mark"></span></span><span class="control-label">知识资产 / 知识库 / 审核</span></label></div></div><footer class="dialog-footer"><button class="btn btn-medium btn-secondary" type="button" data-close-user-grant>取消</button><button class="btn btn-medium btn-primary" type="button" data-save-user-grant>保存额外授权</button></footer></section></div>
</template><script type="module" src="../assets/js/app.js?v=39"></script></body></html>
