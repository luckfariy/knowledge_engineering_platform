<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>加工模型 - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css?v=3"/></head><body data-page="processing-models"><div data-shell></div><template data-page-template>
<header class="page-heading"><div><h1 class="page-title text-x-big-bold">加工模型</h1><p class="page-description text-normal">以可复用抽取模型定义知识的识别目标、输出结构和处理规则。</p></div><div class="page-actions"><button class="btn btn-medium btn-primary" type="button" data-open-model-dialog>新建抽取模型</button></div></header>
<section class="toolbar"><label class="field model-search"><span class="visually-hidden">搜索加工模型</span><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索模型名称或业务用途" data-model-search/></span></label><span class="toolbar-spacer"></span><span class="section-note text-small" data-model-count>共 6 个模型</span></section>
<section class="model-card-grid" aria-label="加工模型列表" data-model-grid>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">FAQ</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">FAQ抽取模型</h2><p class="text-normal">从制度、手册与问答记录中识别问题、标准答案和适用条件。</p><div class="model-tags"><span class="tag tag-small">问答对</span><span class="tag tag-small">适用范围</span><span class="tag tag-small">来源证据</span></div><div class="model-card-foot text-small"><span>版本 v2.4</span><span>使用 18 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开 FAQ 抽取模型详情">查看模型</button></article>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">票</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">票据抽取模型</h2><p class="text-normal">识别票据类型、金额、日期、交易双方与关键凭证编号。</p><div class="model-tags"><span class="tag tag-small">OCR</span><span class="tag tag-small">字段抽取</span><span class="tag tag-small">格式校验</span></div><div class="model-card-foot text-small"><span>版本 v3.1</span><span>使用 26 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开票据抽取模型详情">查看模型</button></article>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">合</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">合同抽取模型</h2><p class="text-normal">提取合同主体、标的、金额、期限、权利义务与风险条款。</p><div class="model-tags"><span class="tag tag-small">合同主体</span><span class="tag tag-small">关键条款</span><span class="tag tag-small">风险点</span></div><div class="model-card-foot text-small"><span>版本 v4.0</span><span>使用 35 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开合同抽取模型详情">查看模型</button></article>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">对</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">业务对象抽取模型</h2><p class="text-normal">识别客户、产品、机构、账户等业务对象及其标识与属性。</p><div class="model-tags"><span class="tag tag-small">对象类型</span><span class="tag tag-small">业务属性</span><span class="tag tag-small">唯一标识</span></div><div class="model-card-foot text-small"><span>版本 v2.8</span><span>使用 42 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开业务对象抽取模型详情">查看模型</button></article>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">指</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">指标抽取模型</h2><p class="text-normal">提取指标名称、口径、计算公式、统计周期与维度。</p><div class="model-tags"><span class="tag tag-small">指标口径</span><span class="tag tag-small">计算公式</span><span class="tag tag-small">统计维度</span></div><div class="model-card-foot text-small"><span>版本 v1.9</span><span>使用 21 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开指标抽取模型详情">查看模型</button></article>
  <article class="model-card" data-model-card><div class="model-card-head"><span class="model-glyph text-medium-bold">关</span><span class="tag tag-status tag-status-lime">已上架</span></div><h2 class="text-medium-bold">关系抽取模型</h2><p class="text-normal">基于已识别实体提取对象间的业务关系、方向与来源证据。</p><div class="model-tags"><span class="tag tag-small">实体对</span><span class="tag tag-small">关系类型</span><span class="tag tag-small">置信度</span></div><div class="model-card-foot text-small"><span>版本 v3.6</span><span>使用 31 次</span></div><button class="btn btn-dense btn-text model-card-action" type="button" data-toast="已打开关系抽取模型详情">查看模型</button></article>
</section>
<div class="dialog-mask" data-model-dialog hidden><div class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="model-dialog-title"><div class="dialog-header"><h2 class="dialog-title" id="model-dialog-title">新建抽取模型</h2><button class="dialog-close" type="button" aria-label="关闭" data-close-model-dialog></button></div><form data-model-form><div class="dialog-body form-stack"><label class="field"><span class="field-label">模型名称</span><span class="input-wrap input-middle"><input class="input" name="modelName" required placeholder="例如：制度要素抽取模型"/></span></label><label class="field"><span class="field-label">抽取类型</span><span class="input-wrap input-middle"><select class="input" name="modelType" required><option value="">请选择</option><option>FAQ 抽取</option><option>票据抽取</option><option>合同抽取</option><option>业务对象抽取</option><option>指标抽取</option><option>关系抽取</option><option>自定义抽取</option></select></span></label><label class="field"><span class="field-label">模型说明</span><span class="input-wrap"><textarea class="input model-textarea" name="modelDescription" required placeholder="说明识别目标、输入范围和预期输出"></textarea></span></label><label class="field"><span class="field-label">输出字段</span><span class="input-wrap input-middle"><input class="input" name="modelFields" required placeholder="多个字段用逗号分隔"/></span></label></div><div class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-close-model-dialog>取消</button><button class="btn btn-medium btn-primary" type="submit">创建模型</button></div></form></div></div>
</template><script type="module" src="../assets/js/app.js?v=9"></script></body></html>
