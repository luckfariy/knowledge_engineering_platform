<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>任务中心 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=6" />
</head>
<body data-page="resource-tasks">
  <div data-shell></div>
  <template data-page-template>
    <header class="page-heading">
      <div><h1 class="page-title text-x-big-bold">任务中心</h1><p class="page-description text-normal">集中查看文件上传、连接器同步与自动入目的执行进度和异常。</p></div>
      <div class="page-actions"><a class="btn btn-medium btn-primary" href="documents.html">返回文件中心</a></div>
    </header>
    <section class="grid grid-4" aria-label="资源任务指标">
      <article class="metric-card"><div class="metric-label text-normal"><span>今日任务</span></div><div class="metric-value text-x-big-bold text-number">128</div><div class="metric-foot text-small"><span>较昨日 +16</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>执行中</span><span class="tag tag-status tag-status-blue">运行中</span></div><div class="metric-value text-x-big-bold text-number">6</div><div class="metric-foot text-small"><span>上传 2 · 同步 3 · 入目 1</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>等待处理</span></div><div class="metric-value text-x-big-bold text-number">14</div><div class="metric-foot text-small"><span>最长等待 8 分钟</span></div></article>
      <article class="metric-card"><div class="metric-label text-normal"><span>异常任务</span></div><div class="metric-value text-x-big-bold text-number">4</div><div class="metric-foot text-small"><span class="trend-risk">需要人工处理</span></div></article>
    </section>
    <section class="section panel source-task-detail" data-source-task-detail hidden></section>
    <section class="section panel">
      <div class="toolbar">
        <label class="field"><span class="visually-hidden">搜索资源任务</span><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索任务名称、来源或发起人" data-table-search="#resource-task-table" /></span></label>
        <span class="toolbar-spacer"></span>
        <div class="tabs tabs-dense" role="tablist" aria-label="任务类型筛选"><button class="tabs-item is-active" type="button" data-resource-task-type="all" aria-selected="true">全部</button><button class="tabs-item" type="button" data-resource-task-type="文件上传" aria-selected="false">文件上传</button><button class="tabs-item" type="button" data-resource-task-type="连接器同步" aria-selected="false">连接器同步</button><button class="tabs-item" type="button" data-resource-task-type="元数据补充" aria-selected="false">元数据补充</button><button class="tabs-item" type="button" data-resource-task-type="自动打标" aria-selected="false">自动打标</button><button class="tabs-item" type="button" data-resource-task-type="自动入目" aria-selected="false">自动入目</button></div>
      </div>
      <div class="table-wrap">
        <table class="table" id="resource-task-table">
          <thead><tr><th>任务名称</th><th>任务类型</th><th>资源来源</th><th>发起人</th><th>开始时间</th><th>进度 / 结果</th><th>状态</th><th>操作</th></tr></thead>
          <tbody data-resource-task-rows>
            <tr data-resource-task-row="文件上传"><td class="cell-primary">制度文件批量接入<span class="cell-secondary text-small">TASK-R-20260905-0128</span></td><td>文件上传</td><td>本地上传</td><td>王翠</td><td>10:42</td><td class="text-number">68 / 100</td><td><span class="tag tag-status tag-status-blue">执行中</span></td><td><button class="btn btn-dense btn-text" type="button" data-toast="已打开任务详情">查看</button></td></tr>
            <tr data-resource-task-row="连接器同步"><td class="cell-primary">飞书知识库增量同步<span class="cell-secondary text-small">TASK-R-20260905-0127</span></td><td>连接器同步</td><td>飞书知识库</td><td>系统调度</td><td>10:30</td><td class="text-number">1,842 / 2,316</td><td><span class="tag tag-status tag-status-blue">执行中</span></td><td><button class="btn btn-dense btn-text" type="button" data-toast="已打开任务详情">查看</button></td></tr>
            <tr data-resource-task-row="自动入目"><td class="cell-primary">信贷制度资源自动入目<span class="cell-secondary text-small">TASK-R-20260905-0126</span></td><td>自动入目</td><td>企业空间</td><td>李程</td><td>09:56</td><td class="text-number">326 / 326</td><td><span class="tag tag-status tag-status-lime">已完成</span></td><td><button class="btn btn-dense btn-text" type="button" data-toast="已打开任务详情">查看</button></td></tr>
            <tr data-resource-task-row="连接器同步"><td class="cell-primary">Wiki 全量同步<span class="cell-secondary text-small">TASK-R-20260905-0125</span></td><td>连接器同步</td><td>Wiki 连接器</td><td>系统调度</td><td>08:00</td><td>凭证已失效</td><td><span class="tag tag-status tag-status-red">执行失败</span></td><td><button class="btn btn-dense btn-text" type="button" data-toast="已重新发起任务">重试</button></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>
  <script type="module" src="../assets/js/app.js?v=38"></script>
</body>
</html>
