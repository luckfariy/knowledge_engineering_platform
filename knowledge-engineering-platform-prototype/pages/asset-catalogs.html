<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>资源目录管理 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=27" />
</head>
<body data-page="asset-catalogs">
<div data-shell></div>
<template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">资源目录管理</h1><p class="page-description text-normal">按多套业务目录组织正式资源，快速定位、浏览与治理文件。</p></div></header>
  <section class="asset-catalog-workbench" aria-label="资源目录与文件列表">
    <aside class="panel asset-tree-panel" aria-label="资源目录树">
      <div class="asset-tree-heading"><div><h2 class="panel-title text-medium-bold">资源目录</h2><p class="panel-description text-small"><span data-catalog-tree-count>3</span> 套目录树</p></div><button class="btn btn-dense btn-text asset-tree-create" type="button" data-open-tree-dialog>＋ 新建目录树</button></div>
      <div class="asset-tree-switcher"><label class="field"><span class="field-label text-small">当前目录树</span><span class="input-wrap input-middle"><select class="input" data-tree-switch aria-label="切换目录树"><option value="business">业务分类目录</option><option value="organization">组织机构目录</option><option value="topic">专题资产目录</option></select></span></label></div>
      <div class="asset-tree-tools"><label class="field asset-tree-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索当前目录" data-asset-tree-search aria-label="搜索当前目录" /></span></label><button class="btn btn-dense btn-secondary" type="button" data-open-folder-dialog>新建一级目录</button></div>
      <p class="asset-tree-note text-small"><span data-tree-description>按业务领域组织企业正式知识资产</span><span>最多支持三级</span></p>
      <nav class="asset-directory-tree" role="tree" aria-label="业务分类目录" data-asset-directory-tree></nav>
    </aside>
    <section class="panel asset-file-panel" aria-labelledby="asset-file-title">
      <div class="asset-file-heading"><div><div class="asset-file-path text-small"><button type="button" data-select-tree-root>业务分类目录</button><span>/</span><span data-selected-path>全部文件</span></div><h2 class="panel-title text-medium-bold" id="asset-file-title" data-asset-file-title>全部文件</h2><p class="panel-description text-small" data-asset-file-summary>展示业务分类目录下的全部文件</p></div><div class="page-actions"><button class="btn btn-dense btn-secondary" type="button" data-toast="批量移动面板已打开">批量移动</button></div></div>
      <section class="classification-review" data-classification-review hidden aria-labelledby="classification-review-title"><div class="classification-review-heading"><div><h3 class="text-normal-bold" id="classification-review-title">自动分类结果待确认</h3><p class="text-small">系统仅提供目录建议，确认接受后才会写入业务目录。</p></div><span class="tag tag-status tag-status-secondary" data-classification-review-count>0 项待确认</span></div><div class="classification-review-list" data-classification-review-list></div></section>
      <div class="toolbar file-toolbar"><label class="field file-search"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件名称、类型或负责人" data-asset-file-search aria-label="搜索资源文件" /></span></label><span class="toolbar-spacer"></span><span class="text-small" data-asset-result-count>0 个文件</span></div>
      <div class="table-wrap"><table class="table" id="asset-file-table"><thead><tr><th>资产名称</th><th>类型</th><th>所属目录</th><th>版本</th><th>负责人</th><th>更新时间</th><th>状态</th><th class="cell-actions">操作</th></tr></thead><tbody data-asset-file-rows></tbody></table><div class="source-empty-state" data-asset-empty hidden><strong class="text-normal-bold">当前目录暂无资产</strong><span class="text-small">可上传资产，或从其他目录移动到这里。</span></div></div>
    </section>
  </section>
  <div class="dialog-mask" data-tree-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="tree-dialog-title"><header class="dialog-header"><h2 class="dialog-title" id="tree-dialog-title">新建目录树</h2><button class="dialog-close" type="button" aria-label="关闭" data-tree-dialog-close></button></header><form data-tree-form><div class="dialog-body asset-dialog-form-stack"><label class="field"><span class="field-label">目录树名称</span><span class="input-wrap input-middle"><input class="input" name="treeName" maxlength="20" placeholder="例如：产品分类目录" required /></span></label><label class="field"><span class="field-label">用途说明</span><span class="input-wrap input-middle"><input class="input" name="treeDescription" maxlength="40" placeholder="说明这套目录的分类维度" required /></span></label><p class="form-hint text-small">新目录树创建后默认没有目录，可继续新建最多三级目录。</p></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-tree-dialog-close>取消</button><button class="btn btn-medium btn-primary" type="submit">创建并切换</button></footer></form></section></div>
  <div class="dialog-mask" data-folder-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="folder-dialog-title"><header class="dialog-header"><h2 class="dialog-title" id="folder-dialog-title" data-folder-dialog-title>新建目录</h2><button class="dialog-close" type="button" aria-label="关闭" data-folder-dialog-close></button></header><form data-folder-form><div class="dialog-body asset-dialog-form-stack"><div class="folder-parent-summary"><span class="text-small">上级目录</span><strong class="text-normal-bold" data-folder-parent-name>当前目录树</strong><span class="tag tag-small" data-folder-level>一级目录</span></div><label class="field"><span class="field-label">目录名称</span><span class="input-wrap input-middle"><input class="input" name="folderName" maxlength="20" placeholder="请输入目录名称" required /></span></label><label class="field"><span class="field-label">目录描述</span><span class="input-wrap"><textarea class="input asset-folder-description" name="folderDescription" rows="3" maxlength="100" placeholder="请输入目录的业务范围或内容说明" required></textarea></span><span class="field-hint text-small">最多 100 个字符，用于帮助用户理解该目录收录的资源范围。</span></label><p class="form-hint text-small">目录层级最多为三级，同级目录名称不可重复。</p></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-folder-dialog-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认新建</button></footer></form></section></div>
  <div class="dialog-mask" data-add-file-dialog hidden><section class="dialog dialog-picker resource-file-picker" role="dialog" aria-modal="true" aria-labelledby="add-file-title"><header class="dialog-header"><div><h2 class="dialog-title" id="add-file-title">添加文件到目录</h2><p class="dialog-description text-small">目标目录：<strong data-add-file-target>未选择</strong></p></div><button class="dialog-close" type="button" aria-label="关闭" data-add-file-close></button></header><div class="dialog-body resource-file-picker-body"><aside class="resource-source-picker"><strong class="text-normal-bold">知识源</strong><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索知识源" data-source-picker-search /></span></label><nav data-source-picker><button class="source-picker-item is-active" type="button" data-source-filter="all">全部知识源 <small>8</small></button><button class="source-picker-item" type="button" data-source-filter="confluence">制度文档空间 <small>3</small></button><button class="source-picker-item" type="button" data-source-filter="gitlab">研发协作空间 <small>2</small></button><button class="source-picker-item" type="button" data-source-filter="s3">归档文件存储 <small>3</small></button></nav></aside><section class="resource-file-choice"><div class="toolbar"><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件名称" data-picker-file-search /></span></label><span class="toolbar-spacer"></span><span class="text-small" data-picker-selected-count>已选 0 个</span></div><div class="table-wrap"><table class="table table-dense"><thead><tr><th class="picker-check"></th><th>文件名称</th><th>类型</th><th>更新时间</th></tr></thead><tbody data-picker-file-rows></tbody></table></div></section></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-add-file-close>取消</button><button class="btn btn-medium btn-primary" type="button" data-add-file-confirm disabled>添加所选文件</button></footer></section></div>
</template>
<script type="module" src="../assets/js/app.js?v=30"></script>
</body></html>
