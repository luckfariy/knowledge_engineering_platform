<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>标签管理 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=44" />
</head>
<body data-page="resource-tags">
  <div data-shell></div>
  <template data-page-template>
    <header class="page-heading"><div><h1 class="page-title text-x-big-bold">标签管理</h1><p class="page-description text-normal">聚合展示文件中心由 AI 自动生成及用户补充的全部标签。</p></div></header>
    <section class="tag-browser-workbench" aria-label="文件标签与关联文件">
      <aside class="panel tag-browser-panel">
        <div class="tag-browser-heading"><div><h2 class="panel-title text-medium-bold">文件标签</h2><p class="panel-description text-small">聚合标签支持归入业务分类</p></div><button class="btn btn-dense btn-secondary" type="button" data-open-tag-category-manager>管理分类</button></div>
        <div class="tag-browser-filters"><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索标签" aria-label="搜索文件标签" data-file-tag-search /></span></label><label class="field"><span class="input-wrap input-middle"><select class="input" aria-label="按标签分类筛选" data-file-tag-category-filter></select></span></label></div>
        <nav class="tag-browser-list" aria-label="文件标签列表" data-file-tag-list></nav>
      </aside>
      <section class="panel tag-file-panel">
        <div class="tag-file-heading"><div><h2 class="panel-title text-medium-bold" data-selected-file-tag>全部标签</h2><p class="panel-description text-small" data-selected-file-tag-description>展示文件中心中的全部已打标文件</p></div><div class="tag-file-heading-actions"><span class="text-small" data-tag-file-count>0 个文件</span></div></div>
        <div class="toolbar"><label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索文件名称、类型或知识源" aria-label="搜索标签关联文件" data-tag-file-search /></span></label></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>文件名称</th><th>文件类型</th><th>知识源</th><th>标签来源</th><th>分析状态</th><th>更新时间</th><th class="cell-actions">操作</th></tr></thead><tbody data-tag-file-rows></tbody></table><div class="source-empty-state" data-tag-file-empty hidden><strong class="text-normal-bold">暂无关联文件</strong><span class="text-small">请选择其他标签或调整搜索条件。</span></div></div>
      </section>
    </section>
    <div class="dialog-mask" data-tag-category-manager hidden><section class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="tag-category-manager-title"><header class="dialog-header"><div><h2 class="dialog-title" id="tag-category-manager-title">标签分类管理</h2><p class="dialog-description text-small">分类用于整理聚合标签，不会修改文件上的标签。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-tag-category-manager-close></button></header><div class="dialog-body tag-category-manager-body"><form class="tag-category-create" data-tag-category-create-form><label class="field"><span class="input-wrap input-middle"><input class="input" name="categoryName" maxlength="30" required placeholder="输入新分类名称" /></span></label><button class="btn btn-medium btn-primary" type="submit">新建分类</button></form><div class="table-wrap"><table class="table"><thead><tr><th>分类名称</th><th>标签数量</th><th class="cell-actions">操作</th></tr></thead><tbody data-tag-category-manager-rows></tbody></table></div></div><footer class="dialog-actions"><button class="btn btn-medium btn-primary" type="button" data-tag-category-manager-save>保存并关闭</button></footer></section></div>
    <div class="dialog-mask" data-tag-category-assign-dialog hidden><section class="dialog dialog-form" role="dialog" aria-modal="true" aria-labelledby="tag-category-assign-title"><header class="dialog-header"><div><h2 class="dialog-title" id="tag-category-assign-title">将标签加入分类</h2><p class="dialog-description text-small">为聚合标签“<span data-assign-tag-name></span>”设置分类。</p></div><button class="dialog-close" type="button" aria-label="关闭" data-tag-category-assign-close></button></header><form data-tag-category-assign-form><div class="dialog-body"><label class="field"><span class="field-label">标签分类</span><span class="input-wrap input-middle"><select class="input" name="tagCategory" data-tag-category-assign-select></select></span></label></div><footer class="dialog-actions"><button class="btn btn-medium btn-secondary" type="button" data-tag-category-assign-close>取消</button><button class="btn btn-medium btn-primary" type="submit">确认</button></footer></form></section></div>
  </template>
  <script type="module" src="../assets/js/app.js?v=54"></script>
</body>
</html>
