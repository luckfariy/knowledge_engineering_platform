<!doctype html><html lang="zh-CN" data-theme="light" data-brand="ht"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>知识服务 - 知识工程平台</title><link rel="stylesheet" href="../assets/design-system/design-tokens.css"/><link rel="stylesheet" href="../assets/design-system/components.css"/><link rel="stylesheet" href="../assets/css/platform.css"/></head><body data-page="services"><div data-shell></div><template data-page-template>
  <header class="page-heading"><div><h1 class="page-title text-x-big-bold">知识索引与服务</h1><p class="page-description text-normal">统一封装全文、向量、图谱、结构化数据和业务规则，以 API、MCP 和 Skill 形式为上层应用提供权限感知的知识上下文。</p></div><div class="page-actions"><button class="btn btn-medium btn-secondary" data-toast="已打开服务调试台">调试台</button><button class="btn btn-medium btn-primary" data-toast="新建知识服务向导已启动">新建服务</button></div></header>
  <section class="grid grid-4"><article class="metric-card"><div class="metric-label"><span>在线服务</span></div><div class="metric-value text-x-big-bold text-number">56</div><div class="metric-foot text-small"><span>99.96% 可用</span></div></article><article class="metric-card"><div class="metric-label"><span>今日调用</span></div><div class="metric-value text-x-big-bold text-number">2.86M</div><div class="metric-foot text-small"><span class="trend-up">+21.6%</span></div></article><article class="metric-card"><div class="metric-label"><span>P95 延迟</span></div><div class="metric-value text-x-big-bold text-number">186 ms</div><div class="metric-foot text-small"><span class="trend-up">低于 SLA</span></div></article><article class="metric-card"><div class="metric-label"><span>权限拦截</span></div><div class="metric-value text-x-big-bold text-number">1,268</div><div class="metric-foot text-small"><span>今日已阻断越权请求</span></div></article></section>
  <section class="section"><div class="section-heading"><h2 class="section-title text-big-bold">标准知识服务</h2><span class="section-note text-small">同一底层能力，支持多种调用协议</span></div><div class="grid grid-3"><article class="panel service-card"><div class="panel-header"><div><span class="tag tag-small">Search API</span><h3 class="panel-title text-medium-bold">企业混合检索</h3></div><span class="tag tag-status tag-status-lime">在线</span></div><p class="text-normal">统一执行关键词、向量、图谱和元数据多路召回，并在检索前执行用户级权限过滤。</p><div class="module-card-footer"><span class="text-small text-number">1.82M 次／日</span><button class="btn btn-dense btn-text" data-toast="已打开 Search API 详情">详情</button></div></article><article class="panel service-card"><div class="panel-header"><div><span class="tag tag-small">Graph API</span><h3 class="panel-title text-medium-bold">图谱查询与推理</h3></div><span class="tag tag-status tag-status-lime">在线</span></div><p class="text-normal">查询企业统一语义图谱与专题知识图谱，返回实体、关系、路径、规则和来源证据。</p><div class="module-card-footer"><span class="text-small text-number">426K 次／日</span><button class="btn btn-dense btn-text" data-toast="已打开 Graph API 详情">详情</button></div></article><article class="panel service-card"><div class="panel-header"><div><span class="tag tag-small">RAG Context</span><h3 class="panel-title text-medium-bold">可信问答上下文</h3></div><span class="tag tag-status tag-status-lime">在线</span></div><p class="text-normal">为大模型组装包含文档版本、权威等级、适用范围和原文定位的可引用上下文。</p><div class="module-card-footer"><span class="text-small text-number">618K 次／日</span><button class="btn btn-dense btn-text" data-toast="已打开 RAG 服务详情">详情</button></div></article></div></section>
  <section class="section grid grid-main-aside"><article class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">服务目录</h2><p class="panel-description text-small">面向应用和 Agent 的可复用知识能力</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>服务名称</th><th>封装方式</th><th>知识范围</th><th>版本</th><th>P95</th><th>状态</th></tr></thead><tbody><tr><td class="cell-primary"><a href="#">授信制度混合检索</a><span class="cell-secondary text-small">svc-credit-policy-search</span></td><td><span class="tag tag-small">API</span> <span class="tag tag-small">MCP</span> <span class="tag tag-small">Skill</span></td><td>授信制度知识包</td><td class="text-number">v2.8</td><td class="text-number">142 ms</td><td><span class="tag tag-status tag-status-lime">在线</span></td></tr><tr><td class="cell-primary"><a href="#">客户 360 实体视图</a><span class="cell-secondary text-small">svc-customer-360</span></td><td><span class="tag tag-small">Graph API</span> <span class="tag tag-small">MCP</span></td><td>客户主数据＋关系图谱</td><td class="text-number">v4.2</td><td class="text-number">268 ms</td><td><span class="tag tag-status tag-status-lime">在线</span></td></tr><tr><td class="cell-primary"><a href="#">合同条款风险识别</a><span class="cell-secondary text-small">skill-contract-risk</span></td><td><span class="tag tag-small">Skill</span></td><td>合同知识图谱＋风险规则</td><td class="text-number">v1.6</td><td class="text-number">1.8 s</td><td><span class="tag tag-status tag-status-blue">灰度</span></td></tr></tbody></table></div></article><aside class="panel"><div class="panel-header"><div><h2 class="panel-title text-big-bold">调用示例</h2><p class="panel-description text-small">MCP 工具定义</p></div></div><pre class="code-block text-small"><code>{
  "name": "search_credit_policy",
  "description": "检索当前有效授信制度",
  "input": {
    "query": "string",
    "organization": "string"
  },
  "returns": "evidence[]"
}</code></pre><button class="btn btn-medium btn-secondary" data-toast="工具定义已复制">复制定义</button></aside></section>
