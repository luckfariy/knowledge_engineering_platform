<!doctype html>
<html lang="zh-CN" data-theme="light" data-brand="ht">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>知识源管理 - 知识工程平台</title>
  <link rel="stylesheet" href="../assets/design-system/design-tokens.css" />
  <link rel="stylesheet" href="../assets/design-system/components.css" />
  <link rel="stylesheet" href="../assets/css/platform.css?v=25" />
</head>
<body data-page="knowledge-sources">
  <div data-shell></div>
  <template data-page-template>
    <header class="page-heading source-management-heading">
      <div>
        <h1 class="page-title text-x-big-bold">知识源管理</h1>
        <p class="page-description text-normal">统一配置企业外部数据连接。建立连接后，可在知识库中选择知识源、设定同步范围并启动同步。</p>
      </div>
      <div class="page-actions"><button class="btn btn-medium btn-primary" type="button" data-open-source-dialog>新增知识源</button></div>
    </header>

    <section class="source-stat-strip" aria-label="知识源统计">
      <div><span class="text-small">知识源实例</span><strong class="text-big-bold" data-source-total>6</strong></div>
      <div><span class="text-small">运行正常</span><strong class="text-big-bold">4</strong></div>
      <div><span class="text-small">同步中</span><strong class="text-big-bold">1</strong></div>
      <div><span class="text-small">待处理异常</span><strong class="text-big-bold source-stat-risk">1</strong></div>
    </section>

    <section class="panel source-instance-panel" aria-labelledby="source-instance-title">
      <div class="panel-header source-panel-titlebar">
        <div>
          <h2 class="panel-title text-medium-bold" id="source-instance-title">已配置的知识源</h2>
          <p class="panel-description text-small">连接配置与数据同步分开管理，连接成功不代表内容已同步至知识库。</p>
        </div>
        <div class="source-table-tools">
          <label class="field source-search-field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索名称或知识源类型" aria-label="搜索知识源" data-source-search /></span></label>
          <div class="source-status-filter" role="group" aria-label="按状态筛选">
            <button class="btn btn-dense is-active" type="button" data-source-status="all" aria-pressed="true">全部</button>
            <button class="btn btn-dense" type="button" data-source-status="normal" aria-pressed="false">正常</button>
            <button class="btn btn-dense" type="button" data-source-status="attention" aria-pressed="false">需处理</button>
          </div>
        </div>
      </div>
      <div class="table-wrap source-table-wrap">
        <table class="table source-management-table">
          <thead><tr><th>知识源</th><th>连接状态</th><th>同步状态</th><th>关联知识库</th><th>刷新频率</th><th>最近同步</th><th>创建人</th><th class="cell-actions">操作</th></tr></thead>
          <tbody data-source-instance-list>
            <tr data-source-row data-name="研发协作空间 GitLab" data-status="normal"><td><div class="source-name-cell"><span class="connector-mark connector-gitlab">GL</span><span><strong>研发协作空间</strong><small>GitLab · gitlab.corp.example.com</small></span></div></td><td><span class="tag tag-status tag-status-lime">已连接</span></td><td><span class="sync-state"><i class="sync-dot is-running"></i>同步中 · 68%</span></td><td>研发知识库</td><td>每 30 分钟</td><td>今天 10:42</td><td>陈曦</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-sync-source>立即同步</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
            <tr data-source-row data-name="制度文档空间 Confluence" data-status="normal"><td><div class="source-name-cell"><span class="connector-mark connector-confluence">CF</span><span><strong>制度文档空间</strong><small>Confluence · wiki.corp.example.com</small></span></div></td><td><span class="tag tag-status tag-status-lime">已连接</span></td><td><span class="sync-state"><i class="sync-dot is-success"></i>已完成 · 2,486 项</span></td><td>制度知识库</td><td>每 1 小时</td><td>今天 10:30</td><td>王翠</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-sync-source>立即同步</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
            <tr data-source-row data-name="客户数据仓 PostgreSQL" data-status="normal"><td><div class="source-name-cell"><span class="connector-mark connector-postgresql">PG</span><span><strong>客户数据仓</strong><small>PostgreSQL · 10.24.18.16:5432</small></span></div></td><td><span class="tag tag-status tag-status-lime">已连接</span></td><td><span class="sync-state"><i class="sync-dot is-success"></i>已完成 · 184 张表</span></td><td>客户经营知识库</td><td>每天 02:00</td><td>今天 02:18</td><td>赵楠</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-sync-source>立即同步</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
            <tr data-source-row data-name="授信问题跟踪 Jira" data-status="attention"><td><div class="source-name-cell"><span class="connector-mark connector-jira">JR</span><span><strong>授信问题跟踪</strong><small>Jira · jira.corp.example.com</small></span></div></td><td><span class="tag tag-status tag-status-lime">已连接</span></td><td><span class="sync-state is-error"><i class="sync-dot is-error"></i>同步失败</span></td><td>授信审查知识库</td><td>每 2 小时</td><td>昨天 22:10</td><td>李程</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-sync-source>重试</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
            <tr data-source-row data-name="归档文件存储 S3" data-status="normal"><td><div class="source-name-cell"><span class="connector-mark connector-s3">S3</span><span><strong>归档文件存储</strong><small>S3 · bank-knowledge-prod</small></span></div></td><td><span class="tag tag-status tag-status-lime">已连接</span></td><td><span class="sync-state"><i class="sync-dot is-success"></i>已完成 · 36,824 项</span></td><td>档案知识库</td><td>每 6 小时</td><td>今天 06:02</td><td>刘敏</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-sync-source>立即同步</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
            <tr data-source-row data-name="核心业务库 Oracle" data-status="attention"><td><div class="source-name-cell"><span class="connector-mark connector-oracle">OR</span><span><strong>核心业务库</strong><small>Oracle · 10.24.8.9:1521</small></span></div></td><td><span class="tag tag-status tag-status-secondary">待认证</span></td><td><span class="sync-state"><i class="sync-dot"></i>尚未同步</span></td><td>未关联</td><td>未设置</td><td>—</td><td>管理员</td><td class="cell-actions"><button class="btn btn-dense btn-text" type="button" data-test-row>测试连接</button><button class="btn btn-dense btn-text" type="button" data-edit-source>编辑</button><button class="btn btn-dense btn-text" type="button" data-source-more>更多</button></td></tr>
          </tbody>
        </table>
        <div class="source-empty-state" data-source-empty hidden><strong class="text-normal-bold">没有匹配的知识源</strong><span class="text-small">请调整搜索词或状态筛选条件。</span></div>
      </div>
    </section>

    <section class="source-catalog-section" aria-labelledby="source-catalog-title">
      <div class="section-heading"><div><h2 class="section-title text-medium-bold" id="source-catalog-title">可用知识源</h2><p class="section-note text-small">选择类型后填写连接凭据。敏感字段只用于建立连接，不在页面回显明文。</p></div></div>
      <div class="connector-catalog" data-connector-catalog>
        <button class="connector-option" type="button" data-connector="confluence"><span class="connector-mark connector-confluence">CF</span><span><strong>Confluence</strong><small>同步空间、页面与附件</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="s3"><span class="connector-mark connector-s3">S3</span><span><strong>S3</strong><small>AWS S3 与兼容对象存储</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="oracle"><span class="connector-mark connector-oracle">OR</span><span><strong>Oracle</strong><small>同步表、视图与结构信息</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="jira"><span class="connector-mark connector-jira">JR</span><span><strong>Jira</strong><small>同步项目、问题与评论</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="gitlab"><span class="connector-mark connector-gitlab">GL</span><span><strong>GitLab</strong><small>同步仓库、Issue 与 Wiki</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="github"><span class="connector-mark connector-github">GH</span><span><strong>GitHub</strong><small>同步仓库、Issue 与文档</small></span><em>未配置</em></button>
        <button class="connector-option" type="button" data-connector="mysql"><span class="connector-mark connector-mysql">MY</span><span><strong>MySQL</strong><small>同步表、视图与结构信息</small></span><em>未配置</em></button>
        <button class="connector-option" type="button" data-connector="postgresql"><span class="connector-mark connector-postgresql">PG</span><span><strong>PostgreSQL</strong><small>同步表、视图与结构信息</small></span><em>已配置 1</em></button>
        <button class="connector-option" type="button" data-connector="hive"><span class="connector-mark connector-hive">HV</span><span><strong>Hive</strong><small>同步库表与数据仓元数据</small></span><em>未配置</em></button>
      </div>
    </section>

    <div class="dialog-mask source-dialog-mask" data-source-dialog hidden>
      <section class="dialog dialog-wide source-create-dialog" role="dialog" aria-modal="true" aria-labelledby="source-dialog-title">
        <header class="dialog-header"><div><h2 class="dialog-title text-medium-bold" id="source-dialog-title">新增知识源</h2><p class="source-dialog-subtitle text-small">选择知识源类型并配置连接</p></div><button class="dialog-close" type="button" aria-label="关闭" data-close-source-dialog></button></header>
        <div class="dialog-body source-dialog-body">
          <aside class="source-type-picker" aria-label="知识源类型">
            <label class="field"><span class="input-wrap input-middle"><input class="input" type="search" placeholder="搜索知识源" aria-label="搜索知识源类型" data-connector-search /></span></label>
            <div class="source-type-list" data-source-type-list>
              <button class="source-type-item is-active" type="button" data-source-type="confluence"><span class="connector-mark connector-confluence">CF</span><span>Confluence</span></button>
              <button class="source-type-item" type="button" data-source-type="s3"><span class="connector-mark connector-s3">S3</span><span>S3</span></button>
              <button class="source-type-item" type="button" data-source-type="oracle"><span class="connector-mark connector-oracle">OR</span><span>Oracle</span></button>
              <button class="source-type-item" type="button" data-source-type="jira"><span class="connector-mark connector-jira">JR</span><span>Jira</span></button>
              <button class="source-type-item" type="button" data-source-type="gitlab"><span class="connector-mark connector-gitlab">GL</span><span>GitLab</span></button>
              <button class="source-type-item" type="button" data-source-type="github"><span class="connector-mark connector-github">GH</span><span>GitHub</span></button>
              <button class="source-type-item" type="button" data-source-type="mysql"><span class="connector-mark connector-mysql">MY</span><span>MySQL</span></button>
              <button class="source-type-item" type="button" data-source-type="postgresql"><span class="connector-mark connector-postgresql">PG</span><span>PostgreSQL</span></button>
              <button class="source-type-item" type="button" data-source-type="hive"><span class="connector-mark connector-hive">HV</span><span>Hive</span></button>
            </div>
          </aside>
          <form class="source-config-form" data-source-form>
            <div class="source-config-heading"><span class="connector-mark connector-confluence" data-config-mark>CF</span><div><h3 class="text-normal-bold" data-config-title>配置 Confluence</h3><p class="text-small" data-config-description>同步 Confluence 空间、页面与附件。</p></div></div>
            <div class="source-dynamic-fields" data-source-fields></div>
            <div class="source-connection-note text-small"><strong>连接与同步是两个阶段</strong><span>保存连接后，请前往目标知识库选择此知识源并配置同步范围、解析方式和刷新频率。</span></div>
          </form>
        </div>
        <footer class="dialog-actions source-dialog-actions"><span class="source-test-result text-small" data-source-test-result></span><button class="btn btn-medium" type="button" data-test-source>测试连接</button><button class="btn btn-medium btn-primary" type="button" data-save-source disabled>保存连接</button></footer>
      </section>
    </div>

    <div class="source-more-menu" data-source-more-menu hidden>
      <button type="button" data-toast="已打开知识源日志">查看同步日志</button>
      <button type="button" data-toast="知识源已暂停同步">暂停同步</button>
      <button class="is-danger" type="button" data-toast="删除为演示操作，未真实移除知识源">删除知识源</button>
    </div>
  </template>
  <script type="module" src="../assets/js/app.js?v=26"></script>
</body>
</html>
